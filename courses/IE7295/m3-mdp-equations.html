<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MDP Equations - IE 7295</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#3d3d3d;font-size:12.5px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}

.band{flex:0 0 auto;background:linear-gradient(135deg,#C3E3E4 0%,#C1E2E3 100%);
  padding:9px 16px;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#F5D000 0 33.33%,#E2231A 33.33% 66.66%,#0064B0 66.66% 100%)}
.band h1{margin:0;font-size:16px;font-weight:700;color:#20484A}
.band .sub{display:inline-block;background:rgba(255,255,255,.75);color:#3d5f61;
  padding:2px 9px;border-radius:999px;font-size:11px;margin-top:3px}
.foot{flex:0 0 auto;border-top:1px solid #E4E9EB;background:#fff;padding:8px 16px;
  text-align:center;font-size:11px;color:#a8b0b6}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  padding:10px 14px}
.tabs{flex:0 0 auto;display:inline-flex;background:#fff;border:1px solid #E4E9EB;
  border-radius:999px;padding:3px;align-self:flex-start}
.tab{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#5b7175;background:none;
  border:0;border-radius:999px;padding:7px 20px;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);color:#fff}

.cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:264px 1fr;gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;
  padding-right:2px}
.main{display:flex;flex-direction:column;gap:9px;min-height:0}

.card{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:10px 12px}
.card.rule{border-left:3px solid #8FC8CA;border-radius:0 6px 6px 0}
h2{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#006064;margin:0 0 6px}

.ctl{margin-bottom:9px}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:700;color:#20484A;margin-bottom:2px}
.ctl .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:#006064;
  background:#eef6f6;border-radius:999px;padding:1px 9px}
.ctl .hint{font-size:10px;color:#a8b0b6;margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;
  border-radius:999px;margin:6px 0 0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#0d5f62 0%,#17a2b8 var(--f,0%),
             #e2e9ea var(--f,0%),#e2e9ea 100%)}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;
  width:20px;height:20px;border-radius:999px;background:#fff;border:2px solid #006064;
  box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:10px;background:transparent}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:999px;
  background:#fff;border:2px solid #006064;box-shadow:0 1px 4px rgba(0,0,0,.18)}
select{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;color:#20484A;background:#fff;
  border:1px solid #E4E9EB;border-radius:6px;padding:7px 9px;margin-top:5px;cursor:pointer}
select:focus{outline:none;border-color:#8FC8CA}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:76px;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:7px 0;cursor:pointer;border:1px solid #E4E9EB;
  background:#fff;color:#20484A}
.btn:hover{border-color:#8FC8CA;background:#eef6f6}
.btn.go{border:0;color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%)}
.btn.stop{border:0;color:#fff;background:linear-gradient(135deg,#8b1a1a 0%,#b8433f 100%)}
.btn:disabled{background:#eef1f2;color:#9aa8ae;cursor:not-allowed;border-color:#E4E9EB}

.eq{position:relative;background:rgba(143,200,202,.13);border-left:3px solid #8FC8CA;
  border-radius:0 6px 6px 0;padding:11px 42px 11px 15px;text-align:center;
  min-height:62px;display:flex;flex-direction:column;justify-content:center}
.eq .cap{font-size:11px;color:#3d3d3d;margin-top:6px}

/* the equation flips to its own explanation, because a student who does not
   recognise a symbol has nowhere else to go and will not ask */
.eq-flip{position:absolute;top:9px;right:10px;width:24px;height:24px;padding:0;
  border:1px solid #8FC8CA;border-radius:999px;background:#fff;color:#006064;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .14s}
.eq-flip:hover{background:#006064;color:#fff;border-color:#006064}
.eq.back{background:rgba(0,96,100,.07);border-left-color:#006064;text-align:right}
.eq.back .terms{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;
  text-align:left;font-size:11.5px;line-height:1.5;color:#3d3d3d;width:100%}
.eq.back .terms b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;text-align:right}
.eq.back .lead{font-size:11.5px;color:#3d3d3d;line-height:1.55;margin-bottom:8px;
  text-align:left}
.viz{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #E4E9EB;border-radius:6px;
  padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reading{flex:0 0 auto;height:58px;overflow:auto;background:rgba(0,96,100,.07);
  border-left:3px solid #006064;border-radius:0 6px 6px 0;padding:10px 14px;
  font-size:12px;line-height:1.55;color:#3d3d3d}
.reading b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.reads{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.read{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:8px 11px}
.read .k{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#a8b0b6}
.read .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:#20484A;margin-top:1px}
.read.on .v{color:#006064}
.read.warn .v{color:#8b1a1a}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:20px;margin-bottom:5px;
  font-size:10.5px;line-height:1.45;color:#3d3d3d}
.steps li:last-child{margin-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:15px;
  height:15px;border-radius:999px;background:#006064;color:#fff;font-size:9.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.katex{font-size:1.05em}

/* pieces individual tools draw with, all from the same palette */
.tile{border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;display:flex;
  flex-direction:column;align-items:center;justify-content:center;transition:all .18s}
.tile .k{font-size:10px;color:#a8b0b6}
.tile .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:#20484A}
.tile.on{border:2px solid #006064;background:#eef6f6}
.tile.best{border:2px solid #2e9e6b;background:rgba(0,150,90,.10)}
.tile.best .v{color:#1d6b4a}
.tile.bad{border:2px solid #E2231A;background:rgba(226,35,26,.08)}
.tile.bad .v{color:#8b1a1a}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:100%;
  width:100%;padding-bottom:22px}
.bar{flex:1;max-width:92px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
.bar .fill{width:100%;border-radius:5px 5px 0 0;min-height:3px;
  background:linear-gradient(180deg,#17a2b8,#0d5f62)}
.bar .fill.neg{background:linear-gradient(180deg,#d4685f,#8b1a1a)}
.bar .t{position:absolute;bottom:-19px;font-size:11px;color:#a8b0b6;white-space:nowrap}
.bar .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#006064;margin-bottom:4px}
.work{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#3d3d3d;line-height:2.1}
.work b{color:#006064}
/* first run: who is playing, then what the tool is for. Same pattern as the
   Module 1 game, so a student meets one convention across the whole set. */
.veil{position:fixed;inset:0;background:rgba(32,72,74,.42);z-index:70;display:none;
  align-items:center;justify-content:center;padding:20px}
.veil.on{display:flex}
.dlg{background:#fff;border-radius:10px;padding:22px 26px;max-width:470px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.24);border-top:3px solid #006064}
.dlg h2{font-size:16px;font-weight:700;color:#20484A;margin:0;text-transform:none;
  letter-spacing:0}
.dlg p{font-size:12.5px;line-height:1.6;color:#3d3d3d;margin:0 0 13px}
.dlg input{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;color:#20484A;text-align:center;
  padding:9px 12px;border:1px solid #8FC8CA;border-radius:999px;outline:none}
.dlg input:focus{border-color:#006064}
.dlg .go2{margin-top:11px;width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);border:0;
  border-radius:999px;padding:9px 0;cursor:pointer}
.dlg .skip{background:none;border:0;color:#9aa5a8;font-size:11px;margin-top:7px;
  width:100%;cursor:pointer;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:8px}
.ring{position:relative;flex:0 0 auto;width:36px;height:36px;padding:0;border:0;
  background:none;cursor:pointer}
.ring span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#006064}
.ring:hover span{color:#E2231A}
.introbox{background:rgba(143,200,202,.14);border-left:3px solid #8FC8CA;
  border-radius:0 6px 6px 0;padding:13px 15px;margin-bottom:4px}
.introbox li{font-size:12px;line-height:1.5;color:#3d3d3d;margin-bottom:5px;
  list-style:none;padding-left:14px;position:relative}
.introbox li:last-child{margin-bottom:0}
.introbox li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
  border-radius:999px;background:#8FC8CA}
.introbox b{color:#20484A}
.whois{position:absolute;right:16px;top:9px;display:flex;align-items:center}
.whois .ul{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;background:#006064;border-radius:999px 0 0 999px;padding:3px 8px 3px 10px;
  display:inline-flex;align-items:center;gap:5px}
.whois .un{font-size:11px;font-weight:700;color:#006064;background:#eef6f6;
  border:1px solid #8FC8CA;border-left:0;border-radius:0 999px 999px 0;padding:2px 11px}

/* the shapes only this tool draws; everything else comes from the kit */
.grid4{display:grid;grid-template-columns:repeat(3,140px);grid-template-rows:repeat(3,116px);gap:12px}
.cellbox{border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-size:11px;
  transition:background .18s,border-color .18s}
.cellbox.here{background:#20484A;border-color:#20484A;color:#fff}
.cellbox.here .nm{color:#fff}
.cellbox .nm{font-weight:700;color:#20484A;font-size:12.5px}
.cellbox .p{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:#006064;font-size:24px;margin-top:3px}
.cellbox .r{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#a8b0b6}
.cellbox.blank{border:0;background:none}
.bell{display:flex;align-items:center;gap:18px}
.node{width:124px;height:92px;border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.node .k{font-size:10px;color:#a8b0b6}
.node .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:24px;font-weight:700;color:#20484A}
.node.self{border:2px solid #006064;background:#eef6f6}
.node.best{border:2px solid #2e9e6b;background:rgba(0,150,90,.10)}
.node.best .v{color:#1d6b4a}
.nbrs{display:grid;grid-template-columns:repeat(2,124px);gap:10px}
.arrowcol{display:flex;flex-direction:column;align-items:center;color:#8FC8CA;font-size:11px}
</style></head><body><div class="band"><h1>MDP Equations</h1><div class="sub">Module 3 &middot; the three equations chapter 3 is built on</div></div><div class="stage"><div class="tabs"><button class="tab on" data-t="trans" type="button">Transition</button><button class="tab" data-t="ret" type="button">Return</button><button class="tab" data-t="bell" type="button">Bellman</button></div><div class="cols"><div class="side"><div class="card rule" id="controls"></div><div class="card rule" id="says"></div><div class="card rule" id="try"></div></div><div class="main"><div class="card eq" id="eq"></div><div class="viz" id="viz"></div><div class="reading" id="reading"></div><div class="reads" id="reads"></div></div></div></div><div class="foot">IE7295: Applied Reinforcement Learning &middot; Prof. Dehghani</div><div class="veil" id="name-veil"><div class="dlg"><h2>Before you start</h2><p>Put your name in so it appears on the tool. Any screenshot you take for an assignment will then carry it.</p><input type="text" id="name-in" maxlength="40" placeholder="Your name" autocomplete="name" spellcheck="false"><button class="go2" type="button" id="name-go">Start</button><button class="skip" type="button" id="name-skip">Skip</button></div></div><div class="veil" id="intro-veil"><div class="dlg"><div class="dlg-head"><h2 id="intro-hi">How this works</h2><button class="ring" id="intro-skip" type="button" aria-label="Skip"><svg viewBox="0 0 36 36" width="36" height="36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#dfe8e9" stroke-width="3"/><circle id="intro-ring" cx="18" cy="18" r="15.5" fill="none" stroke="#006064" stroke-width="3" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><span id="intro-count">10</span></button></div><div class="introbox" id="intro-body"></div><button class="go2" type="button" id="intro-go">Got it</button></div></div><script>
var INTRO = ['MDP Equations', [
  'Three equations chapter 3 is built on, one per tab, each with the picture it describes.',
  'The controls on the left change the numbers; the sentence under the picture reads them back.',
  'Every equation has a <b>question mark</b> in its corner. Click it and the card flips to explain each symbol.',
  'Nothing here is graded. Move things until the readouts stop surprising you.',
]];

var S = {
  tab: 'trans',
  main: 80, side: 10, action: 'Up',
  gammaR: 90, steps: 5, seq: 'const',
  gammaB: 90, reward: -1, V: 0, iter: 0, last: 0,
  NB: [5, 3, 2, 4]
};
var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (p[0] === sel ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' on' : '') + '"><div class="k">' + it[0] +
           '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}

function onInput(id, val){
  if (id === 'main'){ S.main = val; if (S.main + 2 * S.side > 100) S.side = Math.floor((100 - S.main) / 2); }
  if (id === 'side'){ S.side = val; if (S.main + 2 * S.side > 100) S.main = 100 - 2 * S.side; }
  if (id === 'action') S.action = val;
  if (id === 'gammaR') S.gammaR = val;
  if (id === 'steps')  S.steps = val;
  if (id === 'seq')    S.seq = val;
  if (id === 'gammaB') S.gammaB = val;
  if (id === 'reward') S.reward = +val;
  render();
}

/* ---- transition ------------------------------------------------------- */
function transProbs(){
  var p = S.main / 100, q = S.side / 100, back = Math.max(0, 1 - p - 2 * q);
  return [p, q, q, back];
}
function drawTrans(){
  var pr = transProbs(), dirs = ['Up', 'Right', 'Down', 'Left'];
  var i = dirs.indexOf(S.action);
  var by = {};                                   // probability by compass point
  by[dirs[i]] = pr[0];
  by[dirs[(i + 1) % 4]] = pr[1];
  by[dirs[(i + 3) % 4]] = pr[2];
  by[dirs[(i + 2) % 4]] = pr[3];

  function box(d){
    var v = by[d] || 0;
    return '<div class="cellbox"><div class="nm">' + d + '</div>' +
           '<div class="p">' + v.toFixed(2) + '</div>' +
           '<div class="r">r = -1</div></div>';
  }
  $('viz').innerHTML =
    '<div class="grid4">' +
      '<div class="cellbox blank"></div>' + box('Up') + '<div class="cellbox blank"></div>' +
      box('Left') +
      '<div class="cellbox here"><div class="nm">s</div><div class="r" style="color:#cfe6e7">now here</div></div>' +
      box('Right') +
      '<div class="cellbox blank"></div>' + box('Down') + '<div class="cellbox blank"></div>' +
    '</div>';

  var H = 0;
  pr.forEach(function(v){ if (v > 0) H -= v * Math.log2(v); });
  var tot = pr.reduce(function(a, b){ return a + b; }, 0);
  $('reads').innerHTML = reads([
    ['total p', tot.toFixed(2), Math.abs(tot - 1) < 0.005],
    ['expected r', '-1.00', false],
    ['entropy', H.toFixed(2), false],
    ['largest p', Math.max.apply(null, pr).toFixed(2), false]
  ]);
}

/* ---- return ----------------------------------------------------------- */
function rewardsFor(){
  var n = S.steps, out = [];
  for (var k = 0; k < n; k++){
    if (S.seq === 'const') out.push(-1);
    else if (S.seq === 'up') out.push(k + 1);
    else out.push(k === n - 1 ? 10 : 0);
  }
  return out;
}
function drawReturn(){
  var g = S.gammaR / 100, rs = rewardsFor(), G = 0, terms = [];
  rs.forEach(function(r, k){
    var c = Math.pow(g, k) * r;
    G += c; terms.push(c);
  });
  var peak = Math.max.apply(null, terms.map(Math.abs)) || 1;
  $('viz').innerHTML = '<div class="bars">' + terms.map(function(c, k){
    var h = (Math.abs(c) / peak) * 100;
    return '<div class="bar"><div class="c">' + c.toFixed(2) + '</div>' +
           '<div class="fill" style="height:' + h.toFixed(1) + '%"></div>' +
           '<div class="t">t+' + (k + 1) + '</div></div>';
  }).join('') + '</div>';
  $('reads').innerHTML = reads([
    ['return G', G.toFixed(2), true],
    ['gamma^n', Math.pow(g, S.steps).toFixed(2), false],
    ['steps', String(S.steps), false],
    ['mean r', (rs.reduce(function(a,b){return a+b;},0) / rs.length).toFixed(2), false]
  ]);
}

/* ---- bellman ---------------------------------------------------------- */
function drawBellman(){
  var g = S.gammaB / 100, best = Math.max.apply(null, S.NB);
  var next = S.reward + g * best;
  $('viz').innerHTML =
    '<div class="bell">' +
      '<div class="node self"><div class="k">V(s)</div><div class="v">' +
        S.V.toFixed(2) + '</div></div>' +
      '<div class="arrowcol">&#8592;<div style="font-size:10px">max</div></div>' +
      '<div class="nbrs">' + S.NB.map(function(v, i){
        return '<div class="node' + (v === best ? ' best' : '') + '">' +
               '<div class="k">V(s\'' + (i + 1) + ')</div><div class="v">' +
               v.toFixed(2) + '</div></div>'; }).join('') + '</div>' +
      '<div class="work">R(s) = <b>' + S.reward.toFixed(2) + '</b><br>' +
        'max V(s\') = <b>' + best.toFixed(2) + '</b><br>' +
        '&gamma; max V(s\') = <b>' + (g * best).toFixed(2) + '</b><br>' +
        'new V(s) = <b>' + next.toFixed(2) + '</b></div>' +
    '</div>';
  $('reads').innerHTML = reads([
    ['iteration', String(S.iter), false],
    ['new V(s)', next.toFixed(2), true],
    ['change', Math.abs(next - S.V).toFixed(2), false],
    ['settled', Math.abs(next - S.V) < 0.01 && S.iter > 0 ? 'yes' : 'no',
      Math.abs(next - S.V) < 0.01 && S.iter > 0]
  ]);
}
function stepBellman(){
  var g = S.gammaB / 100;
  S.last = S.V;
  S.V = S.reward + g * Math.max.apply(null, S.NB);
  S.iter += 1;
  render();
}
function resetBellman(){ S.V = 0; S.iter = 0; render(); }
function randomise(){
  S.main = 50 + Math.floor(Math.random() * 45);
  S.side = Math.floor(Math.random() * Math.floor((100 - S.main) / 2 + 1));
  render();
}

/* ---- what changes per tab --------------------------------------------- */
var TABS = {
  trans: {
    eq: 'p(s\', r \\mid s, a) = \\Pr\\{S_t = s\',\\, R_t = r \\mid S_{t-1} = s,\\, A_{t-1} = a\\}',
    cap: 'The chance of landing in s\' and collecting r, given you were in s and chose a.',
    explain: ['This is the environment written down. It is the only thing the agent does not control, and everything else in the course is built on top of it.', [
     ['p(...)', 'a probability, between 0 and 1'],
     ['s', 'the state you are in now'],
     ['a', 'the action you chose'],
     ["s'", 'the state you end up in'],
     ['r', 'the reward you collect on the way'],
     ['Pr{...}', 'the chance that all of those happen together'],
     ['|', 'read as "given that", so everything right of it already happened']]],
    says: ['Actions do not always work', 'Everything downstream in this course ' +
           'exists because of the gap between the action chosen and what actually ' +
           'happened.'],
    steps: ['The dark square is the agent now; the four around it are where one ' +
            'move might land it.',
            'Pick an action, then drag <b>Intended direction</b> down to 50% and ' +
            'watch probability leak into the sideways squares.',
            'Watch <b>entropy</b> at the bottom. It is near zero when the outcome ' +
            'is close to certain, and largest when every square is equally likely.',
            'Push <b>sideways slip</b> up until the intended square is no longer ' +
            'the most likely one. That is a world where planning barely helps.'],
    read: function(){
      var pr = transProbs(), H = 0;
      pr.forEach(function(v){ if (v > 0) H -= v * Math.log2(v); });
      var certain = H < 0.6, chaos = H > 1.6;
      return 'Choosing <b>' + S.action + '</b> puts the agent where it meant to go ' +
        '<b>' + (pr[0] * 100).toFixed(0) + '%</b> of the time, sideways <b>' +
        (pr[1] * 200).toFixed(0) + '%</b>, and backwards <b>' +
        (pr[3] * 100).toFixed(0) + '%</b>. Entropy <b>' + H.toFixed(2) + '</b>: ' +
        (certain ? 'the outcome is close to certain, so a plan made here will ' +
                   'usually survive contact with the environment.'
         : chaos ? 'the outcome is close to a coin toss, so the action barely ' +
                   'determines what happens and the agent must rely on trying often.'
         : 'the action mostly works but not reliably, which is the case this ' +
           'whole course is written for.');
    },
    controls: function(){
      return slider('main', 'Intended direction', 0, 100, S.main,
                    function(v){ return v + '%'; }, 'How often the action does what you asked')
           + slider('side', 'Sideways slip', 0, 50, S.side,
                    function(v){ return v + '%'; }, 'Each side, so twice this in total')
           + picker('action', 'Action chosen',
                    [['Up','Up'],['Right','Right'],['Down','Down'],['Left','Left']], S.action)
           + '<div class="btns"><button class="btn" type="button" onclick="randomise()">Randomise</button></div>';
    },
    draw: drawTrans
  },
  ret: {
    eq: 'G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^{2} R_{t+3} + \\cdots' +
        ' = \\sum_{k=0}^{\\infty} \\gamma^{k} R_{t+k+1}',
    cap: 'The return is everything still to come, with later rewards worth less.',
    explain: ['The return is what the agent is actually trying to maximise. Not the next reward, and not the total either: the discounted total.', [
     ['G', 'the return, measured from time t onwards'],
     ['R', 'a single reward, arriving at the step in its subscript'],
     ['gamma', 'the discount, between 0 and 1'],
     ['gamma^k', 'shrinks with distance, so a reward k steps away counts for less'],
     ['sum', 'add up every future step, forever']]],
    says: ['Why discount at all', 'Gamma decides how far ahead the agent cares: near ' +
           'zero it takes whatever is in front of it, near one it waits.'],
    steps: ['Each bar is one future reward after discounting. The number on top ' +
            'is what that reward is actually worth today.',
            'Drag <b>&gamma;</b> to 0.50 and watch the far bars collapse. Then take ' +
            'it to 0.99 and watch them come back almost level.',
            'Switch the sequence to <b>Nothing, then +10</b>. At low &gamma; the ' +
            'return is near zero, because a payoff that far away is worth almost ' +
            'nothing to a myopic agent.',
            'Compare <b>return G</b> with the plain sum of the rewards. The gap ' +
            'between them is exactly what discounting costs.'],
    read: function(){
      var g = S.gammaR / 100, rs = rewardsFor(), G = 0, plain = 0;
      rs.forEach(function(r, k){ G += Math.pow(g, k) * r; plain += r; });
      var lastW = Math.pow(g, S.steps - 1);
      return 'At <b>&gamma; = ' + g.toFixed(2) + '</b> the reward ' + S.steps +
        ' steps out counts for <b>' + (lastW * 100).toFixed(0) + '%</b> of its face ' +
        'value. The rewards add up to <b>' + plain.toFixed(2) + '</b> undiscounted, ' +
        'but the return is <b>' + G.toFixed(2) + '</b>. ' +
        (g < 0.4 ? 'This agent is myopic: it will trade almost any future for a ' +
                   'small gain now.'
         : g > 0.94 ? 'This agent is patient enough to accept a long run of losses ' +
                      'for a payoff at the end.'
         : 'A middling &gamma; like this is the usual choice, and the reason most ' +
           'agents look a little short-sighted.');
    },
    controls: function(){
      return slider('gammaR', 'Discount &gamma;', 0, 100, S.gammaR,
                    function(v){ return (v/100).toFixed(2); }, '0 is myopic, 1 is far-sighted')
           + slider('steps', 'Steps ahead', 3, 8, S.steps,
                    function(v){ return String(v); }, 'How many rewards to add up')
           + picker('seq', 'Reward sequence',
                    [['const','Constant, -1 each step'],['up','Increasing, 1 2 3 ...'],
                     ['goal','Nothing, then +10 at the end']], S.seq);
    },
    draw: drawReturn
  },
  bell: {
    eq: 'V(s) = R(s) + \\gamma \\max_{s\'} V(s\')',
    cap: 'A state is worth what it pays now, plus the discounted value of the best place it leads.',
    explain: ['Every value here is defined using other values, which is why the numbers have to settle rather than be calculated once.', [
     ['V(s)', 'what being in state s is worth'],
     ['R(s)', 'the reward for being here, paid immediately'],
     ['gamma', 'how much the next state counts from here'],
     ['max', 'the agent picks the best neighbour, not the average one'],
     ["V(s')", "the value of a neighbouring state, itself defined this way"]]],
    says: ['Values defined by other values', 'Nothing here is measured directly. Each ' +
           'state borrows its value from its best neighbour, which borrowed from its own.'],
    steps: ['The teal box on the left is the state being updated. The four on the ' +
            'right are where it can go, and the green one is the best of them.',
            'Press <b>Step</b> once. V(s) jumps from 0 to R plus a discounted ' +
            'share of the best neighbour. The arithmetic is written beside it.',
            'Press <b>Step</b> again. Nothing moves, and <b>settled</b> turns to ' +
            'yes. With the neighbours held fixed there is only one answer.',
            'Change the reward to <b>Goal, +10</b> and press Step. The state is now ' +
            'worth more than any neighbour, which is how value spreads outward ' +
            'from a goal in a real grid.'],
    read: function(){
      var g = S.gammaB / 100, best = Math.max.apply(null, S.NB);
      var next = S.reward + g * best, d = Math.abs(next - S.V);
      return 'The best neighbour is worth <b>' + best.toFixed(2) + '</b>. Discounted ' +
        'by <b>' + g.toFixed(2) + '</b> it contributes <b>' + (g * best).toFixed(2) +
        '</b>, and adding the reward of <b>' + S.reward.toFixed(2) + '</b> makes ' +
        'this state worth <b>' + next.toFixed(2) + '</b>. ' +
        (S.iter === 0 ? 'Press Step to apply it.'
         : d < 0.01 ? 'It has stopped changing, so this is the fixed point of the ' +
                      'equation for these neighbours.'
         : 'That is <b>' + d.toFixed(2) + '</b> away from the current value, so it ' +
           'has not settled yet.');
    },
    controls: function(){
      return slider('gammaB', 'Discount &gamma;', 0, 100, S.gammaB,
                    function(v){ return (v/100).toFixed(2); }, 'How much the neighbour is worth here')
           + picker('reward', 'Reward in this state',
                    [['-1','Step cost, -1'],['0','Neutral, 0'],['10','Goal, +10']],
                    String(S.reward))
           + '<div class="btns"><button class="btn go" type="button" onclick="stepBellman()">Step</button>' +
             '<button class="btn" type="button" onclick="resetBellman()">Reset</button></div>';
    },
    draw: drawBellman
  }
};

function render(){
  var t = TABS[S.tab];
  $('eq').innerHTML = '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
  $('says').innerHTML = '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>';
  $('try').innerHTML = '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>';
  $('controls').innerHTML = '<h2>Controls</h2>' + t.controls();
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}

document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      document.querySelector('.tab.on').classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});

var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint, step){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" step="' + (step || 1) + '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (String(p[0]) === String(sel) ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function button(label, fn, kind){
  return '<button class="btn ' + (kind || '') + '" type="button" onclick="' + fn +
         '">' + label + '</button>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' ' + it[2] : '') + '"><div class="k">' +
           it[0] + '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}
var FLIP = {};                       // which tabs are currently showing the back

function flipEq(){
  FLIP[S.tab] = !FLIP[S.tab];
  render();
}
function eqButton(){
  var back = FLIP[S.tab];
  var icon = back
    ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 3.1c-.6.3-.8.7-.8 1.3v.4"/>' +
      '<path d="M12 17.4h.01"/></svg>';
  return '<button class="eq-flip" type="button" onclick="flipEq()" title="' +
         (back ? 'Back to the equation' : 'What does this mean?') + '">' + icon + '</button>';
}

// Rewriting a panel that has not changed destroys whatever the pointer is on,
// which is why Stop could not be clicked while a tool was running.
function setIf(id, html){
  var el = $(id);
  if (el.innerHTML !== html) el.innerHTML = html;
}

function render(){
  var t = TABS[S.tab];
  if (t.eq) {
    $('eq').style.display = '';
    if (FLIP[S.tab] && t.explain){
      $('eq').className = 'card eq back';
      $('eq').innerHTML = eqButton() +
        '<div class="lead">' + t.explain[0] + '</div><div class="terms">' +
        t.explain[1].map(function(x){
          return '<b>' + x[0] + '</b><span>' + x[1] + '</span>'; }).join('') +
        '</div>';
    } else {
      $('eq').className = 'card eq';
      $('eq').innerHTML = (t.explain ? eqButton() : '') +
        '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
    }
  } else { $('eq').style.display = 'none'; }
  setIf('says', '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>');
  setIf('try', '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>');
  setIf('controls', '<h2>Controls</h2>' + t.controls());
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement && t.eq && !(FLIP[S.tab] && t.explain)){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}
document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      var on = document.querySelector('.tab.on');
      if (on) on.classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      if (typeof onTab === 'function') onTab(S.tab);
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});

/* ---- who is playing, and what this is ---------------------------------
   Asked once, remembered after that. The name goes on the band so it lands
   inside any screenshot a student takes for an assignment. INTRO is set by
   each tool: a title and the four lines worth knowing before starting. */
(function(){
  var USER = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/>' +
    '<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  var nameVeil = $('name-veil'), introVeil = $('intro-veil'),
      input = $('name-in'), band = document.querySelector('.band');
  var timer = null, LEN = 97.4, SECS = 10;

  function show(n){
    var slot = document.getElementById('whois');
    if (!slot){
      slot = document.createElement('div');
      slot.className = 'whois'; slot.id = 'whois';
      band.appendChild(slot);
    }
    slot.innerHTML = n ? '<span class="ul">' + USER + 'User</span>' +
                         '<span class="un"></span>' : '';
    if (n) slot.querySelector('.un').textContent = n;
    var hi = $('intro-hi');
    if (hi && window.INTRO) hi.textContent = n ? 'Say hi, ' + n : INTRO[0];
  }
  function closeIntro(){
    if (timer){ clearInterval(timer); timer = null; }
    introVeil.classList.remove('on');
  }
  function openIntro(){
    if (!window.INTRO) return;
    $('intro-body').innerHTML = '<ul style="margin:0;padding:0">' +
      INTRO[1].map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
    introVeil.classList.add('on');
    var left = SECS;
    $('intro-count').textContent = left;
    $('intro-ring').style.strokeDashoffset = 0;
    timer = setInterval(function(){
      left -= 1;
      $('intro-count').textContent = Math.max(0, left);
      $('intro-ring').style.strokeDashoffset = LEN * (SECS - left) / SECS;
      if (left <= 0) closeIntro();
    }, 1000);
  }
  function done(){
    var n = input.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    try { if (n) localStorage.setItem('ie7295-name', n); } catch (e) {}
    show(n);
    nameVeil.classList.remove('on');
    openIntro();
  }
  $('name-go').addEventListener('click', done);
  $('name-skip').addEventListener('click', function(){
    nameVeil.classList.remove('on'); openIntro();
  });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') done(); });
  $('intro-go').addEventListener('click', closeIntro);
  $('intro-skip').addEventListener('click', closeIntro);
  introVeil.addEventListener('click', function(e){ if (e.target === introVeil) closeIntro(); });

  var saved = null;
  try { saved = localStorage.getItem('ie7295-name'); } catch (e) {}
  if (saved){ show(saved); openIntro(); }          // known already, straight to the intro
  else { nameVeil.classList.add('on'); setTimeout(function(){ input.focus(); }, 60); }
})();

</script></body></html>
