<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Multi-Armed Bandits - IE 7295</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#3d3d3d;font-size:12.5px;line-height:1.5;

  padding:9px 16px;position:relative}

  background:linear-gradient(90deg,#F5D000 0 33.33%,#E2231A 33.33% 66.66%,#0064B0 66.66% 100%)}

  text-align:center;font-size:11px;color:#a8b0b6}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  padding:10px 14px}

  border-radius:999px;padding:3px;align-self:flex-start}

  border:0;border-radius:999px;padding:7px 20px;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);color:#fff}

.cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:264px 1fr;gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;
  padding-right:2px}

.card{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:10px 12px}
.card.rule{border-left:3px solid #8FC8CA;border-radius:0 6px 6px 0}
h2{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#006064;margin:0 0 6px}

.ctl{margin-bottom:9px}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:700;color:#20484A;margin-bottom:2px}
.ctl .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:#006064;
  background:#eef6f6;border-radius:999px;padding:1px 9px}
.ctl .hint{font-size:10px;color:#a8b0b6;margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;
  border-radius:999px;margin:6px 0 0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#0d5f62 0%,#17a2b8 var(--f,0%),

input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;

input[type=range]::-moz-range-track{height:10px;background:transparent}

select{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;color:#20484A;background:#fff;
  border:1px solid #E4E9EB;border-radius:6px;padding:7px 9px;margin-top:5px;cursor:pointer}
select:focus{outline:none;border-color:#8FC8CA}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:76px;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:7px 0;cursor:pointer;border:1px solid #E4E9EB;

.eq{position:relative;background:rgba(143,200,202,.13);border-left:3px solid #8FC8CA;

/* the equation flips to its own explanation, because a student who does not
   recognise a symbol has nowhere else to go and will not ask */
.eq-flip{position:absolute;top:9px;right:10px;width:24px;height:24px;padding:0;
  border:1px solid #8FC8CA;border-radius:999px;background:#fff;color:#006064;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .14s}

.eq.back{background:rgba(0,96,100,.07);border-left-color:#006064;text-align:right}
.eq.back .terms{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;
  text-align:left;font-size:11.5px;line-height:1.5;color:#3d3d3d;width:100%}

.viz{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #E4E9EB;border-radius:6px;
  padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reading{flex:0 0 auto;height:58px;overflow:auto;background:rgba(0,96,100,.07);
  border-left:3px solid #006064;border-radius:0 6px 6px 0;padding:10px 14px;

.reading b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.reads{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.read{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:8px 11px}
.read .k{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#a8b0b6}
.read .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:#20484A;margin-top:1px}
.read.on .v{color:#006064}
.read.warn .v{color:#8b1a1a}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:20px;margin-bottom:5px;
  font-size:10.5px;line-height:1.45;color:#3d3d3d}
.steps li:last-child{margin-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:15px;
  height:15px;border-radius:999px;background:#006064;color:#fff;font-size:9.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.katex{font-size:1.05em}

/* pieces individual tools draw with, all from the same palette */
.tile{border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;display:flex;
  flex-direction:column;align-items:center;justify-content:center;transition:all .18s}
.tile .k{font-size:10px;color:#a8b0b6}
.tile .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:#20484A}
.tile.on{border:2px solid #006064;background:#eef6f6}
.tile.best{border:2px solid #2e9e6b;background:rgba(0,150,90,.10)}
.tile.best .v{color:#1d6b4a}
.tile.bad{border:2px solid #E2231A;background:rgba(226,35,26,.08)}
.tile.bad .v{color:#8b1a1a}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:100%;
  width:100%;padding-bottom:22px}
.bar{flex:1;max-width:92px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
.bar .fill{width:100%;border-radius:5px 5px 0 0;min-height:3px;
  background:linear-gradient(180deg,#17a2b8,#0d5f62)}
.bar .fill.neg{background:linear-gradient(180deg,#d4685f,#8b1a1a)}
.bar .t{position:absolute;bottom:-19px;font-size:11px;color:#a8b0b6;white-space:nowrap}
.bar .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#006064;margin-bottom:4px}
.work{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#3d3d3d;line-height:2.1}
.work b{color:#006064}
/* first run: who is playing, then what the tool is for. Same pattern as the
   Module 1 game, so a student meets one convention across the whole set. */
.veil{position:fixed;inset:0;background:rgba(32,72,74,.42);z-index:70;display:none;
  align-items:center;justify-content:center;padding:20px}
.veil.on{display:flex}
.dlg{background:#fff;border-radius:10px;padding:22px 26px;max-width:470px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.24);border-top:3px solid #006064}
.dlg h2{font-size:16px;font-weight:700;color:#20484A;margin:0;text-transform:none;
  letter-spacing:0}
.dlg p{font-size:12.5px;line-height:1.6;color:#3d3d3d;margin:0 0 13px}
.dlg input{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;color:#20484A;text-align:center;
  padding:9px 12px;border:1px solid #8FC8CA;border-radius:999px;outline:none}
.dlg input:focus{border-color:#006064}
.dlg .go2{margin-top:11px;width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);border:0;
  border-radius:999px;padding:9px 0;cursor:pointer}
.dlg .skip{background:none;border:0;color:#9aa5a8;font-size:11px;margin-top:7px;
  width:100%;cursor:pointer;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:8px}
.ring{position:relative;flex:0 0 auto;width:36px;height:36px;padding:0;border:0;
  background:none;cursor:pointer}
.ring span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#006064}
.ring:hover span{color:#E2231A}
.introbox{background:rgba(143,200,202,.14);border-left:3px solid #8FC8CA;
  border-radius:0 6px 6px 0;padding:13px 15px;margin-bottom:4px}
.introbox li{font-size:12px;line-height:1.5;color:#3d3d3d;margin-bottom:5px;
  list-style:none;padding-left:14px;position:relative}
.introbox li:last-child{margin-bottom:0}
.introbox li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
  border-radius:999px;background:#8FC8CA}
.introbox b{color:#20484A}
.whois{position:absolute;right:16px;top:9px;display:flex;align-items:center}
.whois .ul{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;background:#006064;border-radius:999px 0 0 999px;padding:3px 8px 3px 10px;
  display:inline-flex;align-items:center;gap:5px}
.whois .un{font-size:11px;font-weight:700;color:#006064;background:#eef6f6;
  border:1px solid #8FC8CA;border-left:0;border-radius:0 999px 999px 0;padding:2px 11px}

/* the reward that just landed, floating off the arm that paid it */
.pop{position:absolute;top:8px;left:50%;transform:translateX(-50%);opacity:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;
  pointer-events:none;white-space:nowrap}
.pop.up{color:#fff;background:#1d6b4a}
.pop.down{color:#fff;background:#8b1a1a}
.pop.go{animation:pop .62s ease-out}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,4px) scale(.9)}
  18%{opacity:1;transform:translate(-50%,-2px) scale(1)}
  70%{opacity:1;transform:translate(-50%,-16px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-26px) scale(.96)}
}
.tile .v{transition:color .2s}
.tile.on{box-shadow:0 0 0 3px rgba(0,96,100,.12)}
</style></head><body><div class="band"><h1>Multi-Armed Bandits</h1><div class="sub">Module 2 &middot; what it costs to find out</div></div><div class="stage"><div class="tabs"><button class="tab on" data-t="play" type="button">Play</button><button class="tab" data-t="truth" type="button">The answer</button></div><div class="cols"><div class="side"><div class="card rule" id="controls"></div><div class="card rule" id="says"></div><div class="card rule" id="try"></div></div><div class="main"><div class="card eq" id="eq"></div><div class="viz" id="viz"></div><div class="reading" id="reading"></div><div class="reads" id="reads"></div></div></div></div><div class="foot">IE7295: Applied Reinforcement Learning &middot; Prof. Dehghani</div><div class="veil" id="name-veil"><div class="dlg"><h2>Before you start</h2><p>Put your name in so it appears on the tool. Any screenshot you take for an assignment will then carry it.</p><input type="text" id="name-in" maxlength="40" placeholder="Your name" autocomplete="name" spellcheck="false"><button class="go2" type="button" id="name-go">Start</button><button class="skip" type="button" id="name-skip">Skip</button></div></div><div class="veil" id="intro-veil"><div class="dlg"><div class="dlg-head"><h2 id="intro-hi">How this works</h2><button class="ring" id="intro-skip" type="button" aria-label="Skip"><svg viewBox="0 0 36 36" width="36" height="36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#dfe8e9" stroke-width="3"/><circle id="intro-ring" cx="18" cy="18" r="15.5" fill="none" stroke="#006064" stroke-width="3" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><span id="intro-count">10</span></button></div><div class="introbox" id="intro-body"></div><button class="go2" type="button" id="intro-go">Got it</button></div></div><script>
var INTRO = ['Multi-Armed Bandits', [
  'Four machines, each paying out around a hidden average. You cannot see the averages.',
  '<b>Pull an arm</b> to sample it. The estimate on the card is the mean of what it has paid you so far.',
  '<b>Run agent</b> lets epsilon-greedy play instead, so you can compare its choices with yours.',
  '<b>Regret</b> at the bottom is what your choices cost against always knowing the best arm.',
]];

var S = {
  tab: 'play', arms: 4, pulls: 0, total: 0,
  Q: [], N: [], mu: [], best: 0, eps: 10, chosen: -1, lastR: 0,
  autoOn: false, autoT: null, hist: [], samples: [], flash: 0
};
var SIGMA = 0.45;        // three uniforms averaged, scaled: sd = 0.9 * sqrt(3/12)

function newBandit(){
  S.mu = []; S.Q = []; S.N = []; S.hist = []; S.samples = [];
  for (var i = 0; i < S.arms; i++){
    S.mu.push(Math.round((Math.random() * 4 - 1) * 100) / 100);   // true mean
    S.Q.push(0); S.N.push(0); S.samples.push([]);
  }
  S.best = S.mu.indexOf(Math.max.apply(null, S.mu));
  S.pulls = 0; S.total = 0; S.chosen = -1; S.lastR = 0;
  stopAuto();
}
function pull(i){
  var r = S.mu[i] + (Math.random() + Math.random() + Math.random() - 1.5) * 0.9;
  S.N[i] += 1;
  S.Q[i] += (r - S.Q[i]) / S.N[i];        // running mean, no list to keep
  S.pulls += 1; S.total += r; S.chosen = i; S.lastR = r;
  S.samples[i].push(r);
  if (S.samples[i].length > 400) S.samples[i].shift();   // enough for a shape
  S.hist.push(i === S.best);
  S.flash = i;
  render();
  // the reward that just landed, shown where it landed, then faded
  var chip = document.getElementById('pop-' + i);
  if (chip){
    chip.textContent = (r >= 0 ? '+' : '') + r.toFixed(2);
    chip.className = 'pop ' + (r >= 0 ? 'up' : 'down') + ' go';
    setTimeout(function(){ chip.className = 'pop'; }, 620);
  }
}
/* A smoothed histogram of what this arm has actually paid. Drawn from the
   samples rather than from the true mean, because the samples are all a
   student has: the shape is as uncertain as the estimate on top of it. */
function spark(i, w, h){
  var xs = S.samples[i];
  if (!xs.length) return '<svg width="' + w + '" height="' + h + '"></svg>';
  var LO = -3, HI = 5, B = 26, bins = new Array(B).fill(0);
  xs.forEach(function(v){
    var k = Math.floor((v - LO) / (HI - LO) * B);
    if (k >= 0 && k < B) bins[k] += 1;
  });
  var sm = bins.map(function(_, k){          // three-point smoothing
    return (bins[k-1] || 0) * 0.25 + bins[k] * 0.5 + (bins[k+1] || 0) * 0.25;
  });
  var peak = Math.max.apply(null, sm) || 1;
  var pts = sm.map(function(v, k){
    return ((k + 0.5) / B * w).toFixed(1) + ',' + (h - (v / peak) * (h - 3)).toFixed(1);
  }).join(' ');
  var zeroX = ((0 - LO) / (HI - LO) * w).toFixed(1);
  return '<svg width="' + w + '" height="' + h + '" style="display:block">' +
    '<line x1="' + zeroX + '" y1="0" x2="' + zeroX + '" y2="' + h +
      '" stroke="#dfe6e8" stroke-width="1"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#17a2b8" stroke-width="2" ' +
      'stroke-linejoin="round"/>' +
    '<polygon points="0,' + h + ' ' + pts + ' ' + w + ',' + h +
      '" fill="rgba(23,162,184,.16)"/></svg>';
}

function greedyPick(){
  if (Math.random() < S.eps / 100){
    return Math.floor(Math.random() * S.arms);
  }
  var b = 0;
  for (var i = 1; i < S.arms; i++) if (S.Q[i] > S.Q[b]) b = i;
  return b;
}
function stepAgent(){ pull(greedyPick()); }
function stopAuto(){
  S.autoOn = false;
  if (S.autoT){ clearInterval(S.autoT); S.autoT = null; }
}
function toggleAuto(){
  if (S.autoOn){ stopAuto(); render(); return; }
  S.autoOn = true;
  S.autoT = setInterval(function(){
    if (S.pulls >= 200){ stopAuto(); render(); return; }
    stepAgent();
  }, 90);
  render();
}
function onInput(id, val){
  if (id === 'arms'){ S.arms = +val; newBandit(); }
  if (id === 'eps') S.eps = +val;
  render();
}
function onTab(){ stopAuto(); }

function drawArms(){
  var maxQ = Math.max.apply(null, S.Q);
  $('viz').innerHTML = '<div style="display:grid;grid-template-columns:repeat(' +
    S.arms + ',1fr);gap:12px;width:100%;max-width:820px">' +
    S.mu.map(function(mu, i){
      var known = S.N[i] > 0;
      var cls = (i === S.chosen ? ' on' : '') +
                (known && S.Q[i] === maxQ && S.pulls > 0 ? ' best' : '');
      return '<div class="tile' + cls + '" style="padding:12px 8px 11px;position:relative">' +
        '<span class="pop" id="pop-' + i + '"></span>' +
        '<div class="k">arm ' + (i + 1) + '</div>' +
        '<div class="v">' + (known ? S.Q[i].toFixed(2) : '?') + '</div>' +
        '<div style="width:100%;padding:0 6px;margin-top:5px">' + spark(i, 132, 34) + '</div>' +
        '<div class="k" style="margin-top:3px">' + S.N[i] + ' pulls</div>' +
        '<button class="btn go" style="margin-top:8px;padding:6px 14px;flex:0 0 auto" ' +
        'type="button" onclick="pull(' + i + ')">Pull</button></div>';
    }).join('') + '</div>';

  var opt = S.pulls ? S.mu[S.best] * S.pulls : 0;
  var regret = opt - S.total;
  var hits = S.hist.filter(Boolean).length;
  $('reads').innerHTML = reads([
    ['pulls', String(S.pulls), ''],
    ['total reward', S.total.toFixed(1), 'on'],
    ['best arm chosen', S.pulls ? (100 * hits / S.pulls).toFixed(0) + '%' : '-', ''],
    ['regret', S.pulls ? regret.toFixed(1) : '-', regret > 4 ? 'warn' : '']
  ]);
}

var TABS = {
  play: {
    eq: 'Q_{t}(a) \\leftarrow Q_{t-1}(a) + \\frac{1}{N(a)}\\big[R_t - Q_{t-1}(a)\\big]',
    cap: 'Each pull nudges that arm\'s estimate toward the reward you just saw.',
    explain: ['A running average, written so nothing has to be stored. This one line is the whole of what a value-based bandit does.', [
     ['Q(a)', "the estimate of arm a's mean"],
     ['N(a)', 'how many times a has been pulled'],
     ['1/N(a)', 'the step size, shrinking as evidence accumulates'],
     ['R - Q', 'the surprise: how far the reward was from what you expected'],
     ['arrow', 'read as "becomes", so the old value is replaced']]],
    says: ['You cannot see the means', 'Every arm pays out around a hidden average. ' +
           'The only way to find out which is best is to spend pulls finding out, ' +
           'and every pull spent looking is a pull not spent earning.'],
    steps: ['Pull each arm once. The <b>?</b> becomes an estimate, but one sample ' +
            'says almost nothing.',
            'Keep pulling whichever looks best. Watch <b>regret</b> at the bottom: ' +
            'that is what you have lost against always knowing the answer.',
            'Press <b>Run agent</b> to let epsilon-greedy play instead, and compare ' +
            'its regret with yours.',
            'Set <b>epsilon</b> to 0 and run again. It will lock onto whichever arm ' +
            'got lucky first and never find out it was wrong.'],
    read: function(){
      if (!S.pulls) return 'Nothing has been pulled yet, so every arm shows <b>?</b>. ' +
        'The estimates only exist once you have spent something to get them.';
      var lead = 0;
      for (var i = 1; i < S.arms; i++) if (S.Q[i] > S.Q[lead]) lead = i;
      var right = lead === S.best;
      var opt = S.mu[S.best] * S.pulls, regret = opt - S.total;
      return 'After <b>' + S.pulls + '</b> pulls, arm <b>' + (lead + 1) + '</b> looks ' +
        'best at <b>' + S.Q[lead].toFixed(2) + '</b>. ' +
        (right ? 'It really is the best arm. '
               : 'It is not actually the best one, arm <b>' + (S.best + 1) +
                 '</b> is, so the estimates have not caught up yet. ') +
        'Regret is <b>' + regret.toFixed(1) + '</b>, meaning that is how much more ' +
        'you would have earned knowing the answer from the start.';
    },
    controls: function(){
      return slider('arms', 'Number of arms', 2, 6, S.arms, function(v){ return String(v); },
                    'More arms, more to find out')
           + slider('eps', 'Exploration &epsilon;', 0, 50, S.eps,
                    function(v){ return (v/100).toFixed(2); },
                    'How often the agent tries something other than its favourite')
           + '<div class="btns">'
           + button(S.autoOn ? 'Stop' : 'Run agent', 'toggleAuto()', S.autoOn ? 'stop' : 'go')
           + button('One step', 'stepAgent()', '')
           + '</div><div class="btns">' + button('New bandit', 'newBandit();render()', '')
           + '</div>';
    },
    draw: drawArms
  },
  truth: {
    eq: '',
    says: ['What was hidden all along', 'Here are the true means the arms were ' +
           'drawing from. Compare them with the estimates: the arms you pulled ' +
           'often are close, the ones you ignored are anyone\'s guess.'],
    steps: ['The dark bell is the distribution each arm really draws from. The ' +
            'dashed line is its true mean, the solid teal line is your estimate.',
            'The pale shape underneath is what you have actually seen. With a few ' +
            'pulls it is lumpy and nothing like the bell above it.',
            'Find an arm with few pulls. Its two lines are far apart, and nothing ' +
            'on the Play tab would have warned you.',
            'Go back, run the agent to 150 pulls, return here. The good arms line ' +
            'up first. Accuracy follows attention, not fairness.'],
    read: function(){
      var worst = 0, gap = 0;
      for (var i = 0; i < S.arms; i++){
        var d = Math.abs(S.Q[i] - S.mu[i]);
        if (S.N[i] === 0) { worst = i; gap = Infinity; break; }
        if (d > gap){ gap = d; worst = i; }
      }
      if (gap === Infinity) return 'Arm <b>' + (worst + 1) + '</b> has never been ' +
        'pulled, so its estimate of <b>0.00</b> is not a measurement at all. ' +
        'An untried arm is not a bad arm, it is an unknown one.';
      return 'The true best is arm <b>' + (S.best + 1) + '</b> at <b>' +
        S.mu[S.best].toFixed(2) + '</b>. Your estimates are furthest out on arm <b>' +
        (worst + 1) + '</b>, off by <b>' + gap.toFixed(2) + '</b> after <b>' +
        S.N[worst] + '</b> pulls. Accuracy follows attention, not fairness.';
    },
    controls: function(){
      return '<div style="font-size:11.5px;color:#3d3d3d;line-height:1.6">' +
             'This tab reveals the answer. Nothing here is available to the agent ' +
             'while it is playing.</div><div class="btns">' +
             button('New bandit', 'newBandit();render()', '') + '</div>';
    },
    draw: function(){
      $('viz').innerHTML = '<div style="display:grid;grid-template-columns:repeat(' +
        S.arms + ',1fr);gap:14px;width:100%;max-width:880px">' +
        S.mu.map(function(mu, i){ return densityCard(i); }).join('') + '</div>';
      drawReads();
    },
    drawOld: function(){
      var span = Math.max(3, Math.max.apply(null, S.mu.map(Math.abs)) + 0.6);
      $('viz').innerHTML = '<div class="bars" style="padding-bottom:24px">' +
        S.mu.map(function(mu, i){
          var h = (Math.abs(mu) / span) * 88;
          var est = S.N[i] ? S.Q[i] : 0;
          var he = (Math.abs(est) / span) * 88;
          // the number belongs directly above the taller of the two bars, not
          // at the top of a full height column
          var tall = Math.max(h, he);
          return '<div class="bar">' +
            '<div style="width:100%;height:' + tall.toFixed(1) + '%;display:flex;' +
              'flex-direction:column;justify-content:flex-end">' +
              '<div class="c">' + mu.toFixed(2) + '</div>' +
              '<div style="width:100%;display:flex;gap:4px;align-items:flex-end;' +
                'height:100%">' +
                '<div class="fill' + (mu < 0 ? ' neg' : '') + '" style="flex:1;height:' +
                  (h / (tall || 1) * 100).toFixed(1) + '%"></div>' +
                '<div style="flex:1;height:' + (he / (tall || 1) * 100).toFixed(1) +
                  '%;border:2px dashed ' + (S.N[i] ? (est < 0 ? '#e0b0ae' : '#8FC8CA') : '#e2e9ea') +
                  ';border-radius:5px 5px 0 0;min-height:2px"></div>' +
              '</div>' +
            '</div>' +
            '<div class="t">arm ' + (i + 1) + (i === S.best ? ' &#9733;' : '') + '</div></div>';
        }).join('') + '</div>';
      drawReads();
    },
  }
};
/* The true bell the arm draws from, with the samples you have actually seen
   laid over it. Where they disagree is exactly how wrong your estimate is. */
function densityCard(i){
  var w = 210, h = 120, LO = -3, HI = 5;
  function xOf(v){ return (v - LO) / (HI - LO) * w; }
  var pts = [];
  for (var k = 0; k <= 60; k++){
    var v = LO + (HI - LO) * k / 60;
    var d = Math.exp(-Math.pow(v - S.mu[i], 2) / (2 * SIGMA * SIGMA));
    pts.push(xOf(v).toFixed(1) + ',' + (h - 6 - d * (h - 18)).toFixed(1));
  }
  var known = S.N[i] > 0;
  var isBest = i === S.best;
  return '<div class="tile" style="padding:10px 8px 9px' +
      (isBest ? ';border:2px solid #2e9e6b;background:rgba(0,150,90,.07)' : '') + '">' +
    '<div class="k">arm ' + (i + 1) + (isBest ? ' &middot; best' : '') + '</div>' +
    '<svg width="' + w + '" height="' + h + '" style="display:block;margin-top:3px">' +
      '<line x1="' + xOf(0) + '" y1="4" x2="' + xOf(0) + '" y2="' + (h - 6) +
        '" stroke="#e4e9eb" stroke-width="1"/>' +
      '<polygon points="' + xOf(LO) + ',' + (h - 6) + ' ' + pts.join(' ') + ' ' +
        xOf(HI) + ',' + (h - 6) + '" fill="rgba(32,72,74,.10)"/>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#20484A" ' +
        'stroke-width="1.6"/>' +
      '<line x1="' + xOf(S.mu[i]) + '" y1="6" x2="' + xOf(S.mu[i]) + '" y2="' + (h - 6) +
        '" stroke="#20484A" stroke-width="2" stroke-dasharray="3 3"/>' +
      (known ? '<line x1="' + xOf(S.Q[i]) + '" y1="6" x2="' + xOf(S.Q[i]) + '" y2="' +
        (h - 6) + '" stroke="#006064" stroke-width="2.4"/>' : '') +
    '</svg>' +
    '<div style="width:100%;padding:0 4px">' + spark(i, w - 8, 40) + '</div>' +
    '<div style="display:flex;gap:10px;font-size:10px;margin-top:4px">' +
      '<span style="color:#20484A">true <b>' + S.mu[i].toFixed(2) + '</b></span>' +
      '<span style="color:#006064">yours <b>' +
        (known ? S.Q[i].toFixed(2) : '-') + '</b></span>' +
    '</div>' +
    '<div class="k" style="margin-top:2px">' + S.N[i] + ' pulls</div></div>';
}

function drawReads(){
  var hits = S.hist.filter(Boolean).length;
  $('reads').innerHTML = reads([
    ['pulls', String(S.pulls), ''],
    ['true best', 'arm ' + (S.best + 1), 'on'],
    ['best arm chosen', S.pulls ? (100 * hits / S.pulls).toFixed(0) + '%' : '-', ''],
    ['arms untried', String(S.N.filter(function(n){ return n === 0; }).length),
      S.N.filter(function(n){ return n === 0; }).length ? 'warn' : '']
  ]);
}
newBandit();

var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint, step){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" step="' + (step || 1) + '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (String(p[0]) === String(sel) ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function button(label, fn, kind){
  return '<button class="btn ' + (kind || '') + '" type="button" onclick="' + fn +
         '">' + label + '</button>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' ' + it[2] : '') + '"><div class="k">' +
           it[0] + '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}
var FLIP = {};                       // which tabs are currently showing the back

function flipEq(){
  FLIP[S.tab] = !FLIP[S.tab];
  render();
}
function eqButton(){
  var back = FLIP[S.tab];
  var icon = back
    ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 3.1c-.6.3-.8.7-.8 1.3v.4"/>' +
      '<path d="M12 17.4h.01"/></svg>';
  return '<button class="eq-flip" type="button" onclick="flipEq()" title="' +
         (back ? 'Back to the equation' : 'What does this mean?') + '">' + icon + '</button>';
}

// Rewriting a panel that has not changed destroys whatever the pointer is on,
// which is why Stop could not be clicked while a tool was running.
function setIf(id, html){
  var el = $(id);
  if (el.innerHTML !== html) el.innerHTML = html;
}

function render(){
  var t = TABS[S.tab];
  if (t.eq) {
    $('eq').style.display = '';
    if (FLIP[S.tab] && t.explain){
      $('eq').className = 'card eq back';
      $('eq').innerHTML = eqButton() +
        '<div class="lead">' + t.explain[0] + '</div><div class="terms">' +
        t.explain[1].map(function(x){
          return '<b>' + x[0] + '</b><span>' + x[1] + '</span>'; }).join('') +
        '</div>';
    } else {
      $('eq').className = 'card eq';
      $('eq').innerHTML = (t.explain ? eqButton() : '') +
        '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
    }
  } else { $('eq').style.display = 'none'; }
  setIf('says', '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>');
  setIf('try', '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>');
  setIf('controls', '<h2>Controls</h2>' + t.controls());
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement && t.eq && !(FLIP[S.tab] && t.explain)){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}
document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      var on = document.querySelector('.tab.on');
      if (on) on.classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      if (typeof onTab === 'function') onTab(S.tab);
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});

/* ---- who is playing, and what this is ---------------------------------
   Asked once, remembered after that. The name goes on the band so it lands
   inside any screenshot a student takes for an assignment. INTRO is set by
   each tool: a title and the four lines worth knowing before starting. */
(function(){
  var USER = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/>' +
    '<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  var nameVeil = $('name-veil'), introVeil = $('intro-veil'),
      input = $('name-in'), band = document.querySelector('.band');
  var timer = null, LEN = 97.4, SECS = 10;

  function show(n){
    var slot = document.getElementById('whois');
    if (!slot){
      slot = document.createElement('div');
      slot.className = 'whois'; slot.id = 'whois';
      band.appendChild(slot);
    }
    slot.innerHTML = n ? '<span class="ul">' + USER + 'User</span>' +
                         '<span class="un"></span>' : '';
    if (n) slot.querySelector('.un').textContent = n;
    var hi = $('intro-hi');
    if (hi && window.INTRO) hi.textContent = n ? 'Say hi, ' + n : INTRO[0];
  }
  function closeIntro(){
    if (timer){ clearInterval(timer); timer = null; }
    introVeil.classList.remove('on');
  }
  function openIntro(){
    if (!window.INTRO) return;
    $('intro-body').innerHTML = '<ul style="margin:0;padding:0">' +
      INTRO[1].map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
    introVeil.classList.add('on');
    var left = SECS;
    $('intro-count').textContent = left;
    $('intro-ring').style.strokeDashoffset = 0;
    timer = setInterval(function(){
      left -= 1;
      $('intro-count').textContent = Math.max(0, left);
      $('intro-ring').style.strokeDashoffset = LEN * (SECS - left) / SECS;
      if (left <= 0) closeIntro();
    }, 1000);
  }
  function done(){
    var n = input.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    try { if (n) localStorage.setItem('ie7295-name', n); } catch (e) {}
    show(n);
    nameVeil.classList.remove('on');
    openIntro();
  }
  $('name-go').addEventListener('click', done);
  $('name-skip').addEventListener('click', function(){
    nameVeil.classList.remove('on'); openIntro();
  });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') done(); });
  $('intro-go').addEventListener('click', closeIntro);
  $('intro-skip').addEventListener('click', closeIntro);
  introVeil.addEventListener('click', function(e){ if (e.target === introVeil) closeIntro(); });

  var saved = null;
  try { saved = localStorage.getItem('ie7295-name'); } catch (e) {}
  if (saved){ show(saved); openIntro(); }          // known already, straight to the intro
  else { nameVeil.classList.add('on'); setTimeout(function(){ input.focus(); }, 60); }
})();

</script></body></html>
