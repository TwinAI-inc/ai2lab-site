</style></head><body><div class="band"><h1>The Cliff Walker</h1><div class="sub">Module 6 &middot; SARSA and Q-learning, one term apart</div></div><div class="stage"><div class="tabs"><button class="tab on" data-t="race" type="button">Two agents</button><button class="tab" data-t="why" type="button">Why they differ</button></div><div class="cols"><div class="side"><div class="card rule" id="controls"></div><div class="card rule" id="says"></div><div class="card rule" id="try"></div></div><div class="main"><div class="card eq" id="eq"></div><div class="viz" id="viz"></div><div class="reading" id="reading"></div><div class="reads" id="reads"></div></div></div></div><div class="foot">IE7295: Applied Reinforcement Learning &middot; Prof. Dehghani</div><div class="veil" id="name-veil"><div class="dlg"><h2>Before you start</h2><p>Put your name in so it appears on the tool. Any screenshot you take for an assignment will then carry it.</p><input type="text" id="name-in" maxlength="40" placeholder="Your name" autocomplete="name" spellcheck="false"><button class="go2" type="button" id="name-go">Start</button><button class="skip" type="button" id="name-skip">Skip</button></div></div><div class="veil" id="intro-veil"><div class="dlg"><div class="dlg-head"><h2 id="intro-hi">How this works</h2><button class="ring" id="intro-skip" type="button" aria-label="Skip"><svg viewBox="0 0 36 36" width="36" height="36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#dfe8e9" stroke-width="3"/><circle id="intro-ring" cx="18" cy="18" r="15.5" fill="none" stroke="#006064" stroke-width="3" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><span id="intro-count">10</span></button></div><div class="introbox" id="intro-body"></div><button class="go2" type="button" id="intro-go">Got it</button></div></div><script>
var INTRO = ['The Cliff Walker', [
  'Two agents learn the same board. The red strip is a cliff: falling in costs 100 and sends them back to S.',
  'SARSA backs up the action it will actually take. Q-learning backs up the best one available.',
  '<b>Run</b> and watch the highlighted routes separate after about 150 episodes.',
  'The falls counter is the price Q-learning pays for the shorter route.',
]];

var R = 4, C = 12;
var START = [3, 0], GOAL = [3, 11];
var S = {
  tab: 'race', eps: 10, alpha: 50, gamma: 100,
  ag: {}, episodes: 0, autoOn: false, autoT: null
};

function blank(){
  var q = [];
  for (var r = 0; r < R; r++){
    q.push([]);
    for (var c = 0; c < C; c++) q[r].push([0, 0, 0, 0]);   // up down left right
  }
  return q;
}
function reset(){
  S.ag = {
    sarsa: {Q: blank(), falls: 0, ret: 0, name: 'SARSA'},
    qlearn: {Q: blank(), falls: 0, ret: 0, name: 'Q-learning'}
  };
  S.episodes = 0;
  stopAuto();
}
function isCliff(r, c){ return r === 3 && c > 0 && c < 11; }
function move(r, c, a){
  var d = [[-1,0],[1,0],[0,-1],[0,1]][a];
  var nr = Math.max(0, Math.min(R - 1, r + d[0]));
  var nc = Math.max(0, Math.min(C - 1, c + d[1]));
  return [nr, nc];
}
function pick(Q, r, c, eps){
  if (Math.random() < eps) return Math.floor(Math.random() * 4);
  var q = Q[r][c], b = 0;
  for (var a = 1; a < 4; a++) if (q[a] > q[b]) b = a;
  return b;
}
function bestOf(Q, r, c){ return Math.max.apply(null, Q[r][c]); }

function episode(ag, onPolicy){
  var eps = S.eps / 100, al = S.alpha / 100, g = S.gamma / 100;
  var r = START[0], c = START[1], steps = 0, ret = 0;
  var a = pick(ag.Q, r, c, eps);
  while (steps < 300){
    var n = move(r, c, a), nr = n[0], nc = n[1];
    var rew = -1, done = false;
    if (isCliff(nr, nc)){ rew = -100; ag.falls += 1; nr = START[0]; nc = START[1]; }
    if (nr === GOAL[0] && nc === GOAL[1]) done = true;
    ret += rew;

    var na = pick(ag.Q, nr, nc, eps);
    // the whole difference between the two methods is this one term: SARSA
    // backs up the action it will actually take, Q-learning the best available
    var target = rew + (done ? 0 : g * (onPolicy ? ag.Q[nr][nc][na] : bestOf(ag.Q, nr, nc)));
    ag.Q[r][c][a] += al * (target - ag.Q[r][c][a]);

    if (done) break;
    r = nr; c = nc; a = na; steps += 1;
  }
  ag.ret = ret;
}
function runEpisode(){
  episode(S.ag.sarsa, true);
  episode(S.ag.qlearn, false);
  S.episodes += 1;
  render();
}
function stopAuto(){ S.autoOn = false; if (S.autoT){ clearInterval(S.autoT); S.autoT = null; } }
function toggleAuto(){
  if (S.autoOn){ stopAuto(); render(); return; }
  S.autoOn = true;
  S.autoT = setInterval(function(){
    if (S.episodes >= 400){ stopAuto(); render(); return; }
    runEpisode();
  }, 40);
  render();
}
function onInput(id, val){
  if (id === 'eps') S.eps = +val;
  if (id === 'alpha') S.alpha = +val;
  render();
}
function onTab(){ stopAuto(); }

/* the greedy route the agent would take now, which is the thing that differs */
function route(Q){
  var r = START[0], c = START[1], path = [[r, c]], seen = {};
  for (var i = 0; i < 60; i++){
    if (r === GOAL[0] && c === GOAL[1]) break;
    var key = r + ',' + c;
    if (seen[key]) break;             // a loop means it has not learned a route
    seen[key] = 1;
    var a = pick(Q, r, c, 0);
    var n = move(r, c, a);
    if (isCliff(n[0], n[1])){ path.push([n[0], n[1]]); break; }
    r = n[0]; c = n[1]; path.push([r, c]);
  }
  return path;
}
function board(Q, path, tint){
  var on = {};
  path.forEach(function(p){ on[p[0] + ',' + p[1]] = 1; });
  var vals = [];
  for (var r = 0; r < R; r++) for (var c = 0; c < C; c++)
    if (!isCliff(r, c)) vals.push(bestOf(Q, r, c));
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = Math.max(0.5, hi - lo);
  var out = '<div style="display:grid;grid-template-columns:repeat(' + C +
            ',30px);grid-template-rows:repeat(' + R + ',30px);gap:3px">';
  for (var r = 0; r < R; r++){
    for (var c = 0; c < C; c++){
      var here = on[r + ',' + c];
      if (isCliff(r, c)){
        out += '<div style="border-radius:4px;background:rgba(226,35,26,.16);' +
               'border:1px solid #e0b0ae"></div>';
        continue;
      }
      var t = (bestOf(Q, r, c) - lo) / span;
      var bg = 'rgba(0,96,100,' + (0.05 + 0.4 * t).toFixed(2) + ')';
      var mark = (r === START[0] && c === START[1]) ? 'S'
               : (r === GOAL[0] && c === GOAL[1]) ? 'G' : '';
      out += '<div style="border-radius:4px;background:' + (here ? tint : bg) +
             ';border:1px solid ' + (here ? tint : '#E4E9EB') + ';display:flex;' +
             'align-items:center;justify-content:center;font-size:10px;font-weight:700;' +
             'color:' + (here ? '#fff' : '#20484A') + '">' + mark + '</div>';
    }
  }
  return out + '</div>';
}
function panel(ag, onPolicy, tint){
  var p = route(ag.Q);
  var safe = p.every(function(q){ return !isCliff(q[0], q[1]); });
  var made = p.length && p[p.length - 1][0] === GOAL[0] && p[p.length - 1][1] === GOAL[1];
  return '<div style="display:flex;flex-direction:column;gap:7px;align-items:center">' +
    '<div style="font-size:11px;font-weight:700;color:' + tint + '">' + ag.name +
      ' <span style="color:#a8b0b6;font-weight:400">' +
      (onPolicy ? 'on-policy' : 'off-policy') + '</span></div>' +
    board(ag.Q, p, tint) +
    '<div style="font-size:10px;color:#a8b0b6">' +
      (made ? 'route found, ' + (p.length - 1) + ' steps'
            : safe ? 'no route yet' : 'route runs into the cliff') +
    '</div></div>';
}

var TABS = {
  race: {
    eq: 'Q(S,A) \\leftarrow Q(S,A) + \\alpha\\big[R + \\gamma\\,Q(S\',A\') - Q(S,A)\\big]' +
        '\\quad\\text{vs}\\quad \\gamma\\max_{a}Q(S\',a)',
    cap: 'Same update, one term apart: the action taken, or the best action available.',
    explain: ['Both agents run this line. The only difference is what goes in the middle term, and it changes the route they end up taking.', [
     ['Q(S,A)', 'the value of taking action A in state S'],
     ['alpha', 'step size'],
     ['R', 'the reward just received'],
     ["Q(S',A')", 'SARSA: the action it will actually take next, exploration included'],
     ["max Q(S',a)", 'Q-learning: the best action available, whether or not it takes it'],
     ['', 'that is the whole of on-policy versus off-policy']]],
    says: ['Two agents, one world', 'The cliff is the red strip. Falling in costs ' +
           '100 and sends the agent back to S. Both learn the same world with the ' +
           'same settings, and they do not end up agreeing.'],
    steps: ['Press <b>Run</b>. Both boards fill in as the agents learn, and the ' +
            'highlighted squares are the route each would take now.',
            'By about 150 episodes they part company. Q-learning hugs the cliff ' +
            'edge; SARSA walks the long way round.',
            'Drag <b>&epsilon;</b> to 0.30 and reset. SARSA retreats further from ' +
            'the edge, because it is learning about an agent that slips more.',
            'Now drag <b>&epsilon;</b> to 0. The two agents converge on the same ' +
            'route, because with no exploration there is no difference between the ' +
            'action taken and the best action.'],
    read: function(){
      if (!S.episodes) return 'Nothing has been learned yet, so neither board has a ' +
        'route. Press Run and watch which one hugs the cliff.';
      var ps = route(S.ag.sarsa.Q), pq = route(S.ag.qlearn.Q);
      function edge(p){ return p.filter(function(q){ return q[0] === 2; }).length; }
      var es = edge(ps), eq = edge(pq);
      return 'After <b>' + S.episodes + '</b> episodes, SARSA has fallen <b>' +
        S.ag.sarsa.falls + '</b> times and Q-learning <b>' + S.ag.qlearn.falls +
        '</b>. ' +
        (eq > es ? 'Q-learning is running <b>' + eq + '</b> squares along the row ' +
                   'above the cliff against SARSA\'s <b>' + es + '</b>: it has ' +
                   'learned the optimal route and does not care that exploring near ' +
                   'an edge is dangerous.'
                 : 'Their routes have not separated yet. Keep running, or raise ' +
                   '&epsilon; so that exploring near the edge actually costs SARSA ' +
                   'something.');
    },
    controls: function(){
      return slider('eps', 'Exploration &epsilon;', 0, 40, S.eps,
                    function(v){ return (v/100).toFixed(2); },
                    'How often either agent steps at random')
           + slider('alpha', 'Step size &alpha;', 5, 90, S.alpha,
                    function(v){ return (v/100).toFixed(2); }, '')
           + '<div class="btns">'
           + button(S.autoOn ? 'Stop' : 'Run', 'toggleAuto()', S.autoOn ? 'stop' : 'go')
           + button('One episode', 'runEpisode()', '') + '</div>'
           + '<div class="btns">' + button('Reset', 'reset();render()', '') + '</div>';
    },
    draw: function(){
      $('viz').innerHTML = '<div style="display:flex;gap:34px;align-items:center">' +
        panel(S.ag.sarsa, true, '#006064') +
        panel(S.ag.qlearn, false, '#0064B0') + '</div>';
      $('reads').innerHTML = reads([
        ['episodes', String(S.episodes), ''],
        ['SARSA falls', String(S.ag.sarsa.falls), ''],
        ['Q-learning falls', String(S.ag.qlearn.falls),
          S.ag.qlearn.falls > S.ag.sarsa.falls ? 'warn' : ''],
        ['epsilon', (S.eps / 100).toFixed(2), '']
      ]);
    }
  },
  why: {
    eq: '',
    says: ['Why the safer one is the worse one', 'Q-learning learns the best route ' +
           'for an agent that never slips. SARSA learns the best route for the agent ' +
           'it actually is, which explores and therefore sometimes falls.'],
    steps: ['Compare <b>falls</b> at the bottom. Q-learning falls far more, because ' +
            'its route runs along the edge while it is still exploring.',
            'Neither is wrong. They answer different questions, and which one you ' +
            'want depends on whether the agent keeps exploring after training.',
            'Set <b>&epsilon;</b> to 0 and reset. The gap closes: with no exploring, ' +
            'the action taken is always the best action.',
            'That is the whole of on-policy versus off-policy, and it is one term ' +
            'in one line of the update.'],
    read: function(){
      var d = S.ag.qlearn.falls - S.ag.sarsa.falls;
      if (!S.episodes) return 'Run some episodes first, then this compares what the ' +
        'two agents paid for their routes.';
      return 'Q-learning has fallen <b>' + d + '</b> more times than SARSA over <b>' +
        S.episodes + '</b> episodes. ' +
        (d > 0 ? 'It is following the shorter route, and paying for it every time ' +
                 'exploration nudges it over the edge. SARSA has priced that risk in.'
               : 'They are still close. Raise &epsilon; so that exploring near the ' +
                 'cliff actually costs something.');
    },
    controls: function(){
      return slider('eps', 'Exploration &epsilon;', 0, 40, S.eps,
                    function(v){ return (v/100).toFixed(2); },
                    'Set this to 0 and the two methods agree')
           + '<div class="btns">'
           + button(S.autoOn ? 'Stop' : 'Run', 'toggleAuto()', S.autoOn ? 'stop' : 'go')
           + button('Reset', 'reset();render()', '') + '</div>';
    },
    draw: function(){
      var a = S.ag.sarsa.falls, b = S.ag.qlearn.falls;
      var peak = Math.max(1, a, b);
      $('viz').innerHTML = '<div class="bars" style="max-width:460px">' +
        [[a, 'SARSA', '#006064'], [b, 'Q-learning', '#0064B0']].map(function(x){
          return '<div class="bar"><div class="c" style="color:' + x[2] + '">' + x[0] +
            '</div><div class="fill" style="height:' + (x[0] / peak * 82).toFixed(1) +
            '%;background:' + x[2] + '"></div><div class="t">' + x[1] +
            ' falls</div></div>';
        }).join('') + '</div>';
      $('reads').innerHTML = reads([
        ['episodes', String(S.episodes), ''],
        ['SARSA falls', String(a), ''],
        ['Q-learning falls', String(b), b > a ? 'warn' : ''],
        ['difference', String(b - a), 'on']
      ]);
    }
  }
};
reset();

var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint, step){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" step="' + (step || 1) + '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (String(p[0]) === String(sel) ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function button(label, fn, kind){
  return '<button class="btn ' + (kind || '') + '" type="button" onclick="' + fn +
         '">' + label + '</button>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' ' + it[2] : '') + '"><div class="k">' +
           it[0] + '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}
var FLIP = {};                       // which tabs are currently showing the back

function flipEq(){
  FLIP[S.tab] = !FLIP[S.tab];
  render();
}
function eqButton(){
  var back = FLIP[S.tab];
  var icon = back
    ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 3.1c-.6.3-.8.7-.8 1.3v.4"/>' +
      '<path d="M12 17.4h.01"/></svg>';
  return '<button class="eq-flip" type="button" onclick="flipEq()" title="' +
         (back ? 'Back to the equation' : 'What does this mean?') + '">' + icon + '</button>';
}

// Rewriting a panel that has not changed destroys whatever the pointer is on,
// which is why Stop could not be clicked while a tool was running.
function setIf(id, html){
  var el = $(id);
  if (el.innerHTML !== html) el.innerHTML = html;
}

function render(){
  var t = TABS[S.tab];
  if (t.eq) {
    $('eq').style.display = '';
    if (FLIP[S.tab] && t.explain){
      $('eq').className = 'card eq back';
      $('eq').innerHTML = eqButton() +
        '<div class="lead">' + t.explain[0] + '</div><div class="terms">' +
        t.explain[1].map(function(x){
          return '<b>' + x[0] + '</b><span>' + x[1] + '</span>'; }).join('') +
        '</div>';
    } else {
      $('eq').className = 'card eq';
      $('eq').innerHTML = (t.explain ? eqButton() : '') +
        '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
    }
  } else { $('eq').style.display = 'none'; }
  setIf('says', '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>');
  setIf('try', '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>');
  setIf('controls', '<h2>Controls</h2>' + t.controls());
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement && t.eq && !(FLIP[S.tab] && t.explain)){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}
document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      var on = document.querySelector('.tab.on');
      if (on) on.classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      if (typeof onTab === 'function') onTab(S.tab);
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});

/* ---- who is playing, and what this is ---------------------------------
   Asked once, remembered after that. The name goes on the band so it lands
   inside any screenshot a student takes for an assignment. INTRO is set by
   each tool: a title and the four lines worth knowing before starting. */
(function(){
  var USER = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/>' +
    '<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  var nameVeil = $('name-veil'), introVeil = $('intro-veil'),
      input = $('name-in'), band = document.querySelector('.band');
  var timer = null, LEN = 97.4, SECS = 10;

  function show(n){
    var slot = document.getElementById('whois');
    if (!slot){
      slot = document.createElement('div');
      slot.className = 'whois'; slot.id = 'whois';
      band.appendChild(slot);
    }
    slot.innerHTML = n ? '<span class="ul">' + USER + 'User</span>' +
                         '<span class="un"></span>' : '';
    if (n) slot.querySelector('.un').textContent = n;
    var hi = $('intro-hi');
    if (hi && window.INTRO) hi.textContent = n ? 'Say hi, ' + n : INTRO[0];
  }
  function closeIntro(){
    if (timer){ clearInterval(timer); timer = null; }
    introVeil.classList.remove('on');
  }
  function openIntro(){
    if (!window.INTRO) return;
    $('intro-body').innerHTML = '<ul style="margin:0;padding:0">' +
      INTRO[1].map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
    introVeil.classList.add('on');
    var left = SECS;
    $('intro-count').textContent = left;
    $('intro-ring').style.strokeDashoffset = 0;
    timer = setInterval(function(){
      left -= 1;
      $('intro-count').textContent = Math.max(0, left);
      $('intro-ring').style.strokeDashoffset = LEN * (SECS - left) / SECS;
      if (left <= 0) closeIntro();
    }, 1000);
  }
  function done(){
    var n = input.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    try { if (n) localStorage.setItem('ie7295-name', n); } catch (e) {}
    show(n);
    nameVeil.classList.remove('on');
    openIntro();
  }
  $('name-go').addEventListener('click', done);
  $('name-skip').addEventListener('click', function(){
    nameVeil.classList.remove('on'); openIntro();
  });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') done(); });
  $('intro-go').addEventListener('click', closeIntro);
  $('intro-skip').addEventListener('click', closeIntro);
  introVeil.addEventListener('click', function(e){ if (e.target === introVeil) closeIntro(); });

  var saved = null;
  try { saved = localStorage.getItem('ie7295-name'); } catch (e) {}
  if (saved){ show(saved); openIntro(); }          // known already, straight to the intro
  else { nameVeil.classList.add('on'); setTimeout(function(){ input.focus(); }, 60); }
})();

</script></body></html>
