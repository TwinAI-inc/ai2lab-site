<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The lunch year - IE 7295</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#3d3d3d;font-size:12.5px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}

.band{flex:0 0 auto;background:linear-gradient(135deg,#C3E3E4 0%,#C1E2E3 100%);
  padding:9px 16px;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,#F5D000 0 33.33%,#E2231A 33.33% 66.66%,#0064B0 66.66% 100%)}
.band h1{margin:0;font-size:16px;font-weight:700;color:#20484A}
.band .sub{display:inline-block;background:rgba(255,255,255,.75);color:#3d5f61;
  padding:2px 9px;border-radius:999px;font-size:11px;margin-top:3px}
.foot{flex:0 0 auto;border-top:1px solid #E4E9EB;background:#fff;padding:8px 16px;
  text-align:center;font-size:11px;color:#a8b0b6}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  padding:10px 14px}
.tabs{flex:0 0 auto;display:inline-flex;background:#fff;border:1px solid #E4E9EB;
  border-radius:999px;padding:3px;align-self:flex-start}
.tab{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#5b7175;background:none;
  border:0;border-radius:999px;padding:7px 20px;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);color:#fff}

.cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:264px 1fr;gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;
  padding-right:2px}
.main{display:flex;flex-direction:column;gap:9px;min-height:0}

.card{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:10px 12px}
.card.rule{border-left:3px solid #8FC8CA;border-radius:0 6px 6px 0}
h2{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#006064;margin:0 0 6px}

.ctl{margin-bottom:9px}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:700;color:#20484A;margin-bottom:2px}
.ctl .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:#006064;
  background:#eef6f6;border-radius:999px;padding:1px 9px}
.ctl .hint{font-size:10px;color:#a8b0b6;margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;
  border-radius:999px;margin:6px 0 0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#0d5f62 0%,#17a2b8 var(--f,0%),
             #e2e9ea var(--f,0%),#e2e9ea 100%)}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;
  width:20px;height:20px;border-radius:999px;background:#fff;border:2px solid #006064;
  box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:10px;background:transparent}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:999px;
  background:#fff;border:2px solid #006064;box-shadow:0 1px 4px rgba(0,0,0,.18)}
select{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;color:#20484A;background:#fff;
  border:1px solid #E4E9EB;border-radius:6px;padding:7px 9px;margin-top:5px;cursor:pointer}
select:focus{outline:none;border-color:#8FC8CA}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:76px;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:7px 0;cursor:pointer;border:1px solid #E4E9EB;
  background:#fff;color:#20484A}
.btn:hover{border-color:#8FC8CA;background:#eef6f6}
.btn.go{border:0;color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%)}
.btn.stop{border:0;color:#fff;background:linear-gradient(135deg,#8b1a1a 0%,#b8433f 100%)}
.btn:disabled{background:#eef1f2;color:#9aa8ae;cursor:not-allowed;border-color:#E4E9EB}

.eq{position:relative;background:rgba(143,200,202,.13);border-left:3px solid #8FC8CA;
  border-radius:0 6px 6px 0;padding:11px 42px 11px 15px;text-align:center;
  min-height:62px;display:flex;flex-direction:column;justify-content:center}
.eq .cap{font-size:11px;color:#3d3d3d;margin-top:6px}

/* the equation flips to its own explanation, because a student who does not
   recognise a symbol has nowhere else to go and will not ask */
.eq-flip{position:absolute;top:9px;right:10px;width:24px;height:24px;padding:0;
  border:1px solid #8FC8CA;border-radius:999px;background:#fff;color:#006064;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .14s}
.eq-flip:hover{background:#006064;color:#fff;border-color:#006064}
.eq.back{background:rgba(0,96,100,.07);border-left-color:#006064;text-align:right}
.eq.back .terms{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;
  text-align:left;font-size:11.5px;line-height:1.5;color:#3d3d3d;width:100%}
.eq.back .terms b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;text-align:right}
.eq.back .lead{font-size:11.5px;color:#3d3d3d;line-height:1.55;margin-bottom:8px;
  text-align:left}
.viz{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #E4E9EB;border-radius:6px;
  padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reading{flex:0 0 auto;height:58px;overflow:auto;background:rgba(0,96,100,.07);
  border-left:3px solid #006064;border-radius:0 6px 6px 0;padding:10px 14px;
  font-size:12px;line-height:1.55;color:#3d3d3d}
.reading b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.reads{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.read{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:8px 11px}
.read .k{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#a8b0b6}
.read .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:#20484A;margin-top:1px}
.read.on .v{color:#006064}
.read.warn .v{color:#8b1a1a}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:20px;margin-bottom:5px;
  font-size:10.5px;line-height:1.45;color:#3d3d3d}
.steps li:last-child{margin-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:15px;
  height:15px;border-radius:999px;background:#006064;color:#fff;font-size:9.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.katex{font-size:1.05em}

/* pieces individual tools draw with, all from the same palette */
.tile{border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;display:flex;
  flex-direction:column;align-items:center;justify-content:center;transition:all .18s}
.tile .k{font-size:10px;color:#a8b0b6}
.tile .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:#20484A}
.tile.on{border:2px solid #006064;background:#eef6f6}
.tile.best{border:2px solid #2e9e6b;background:rgba(0,150,90,.10)}
.tile.best .v{color:#1d6b4a}
.tile.bad{border:2px solid #E2231A;background:rgba(226,35,26,.08)}
.tile.bad .v{color:#8b1a1a}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:100%;
  width:100%;padding-bottom:22px}
.bar{flex:1;max-width:92px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
.bar .fill{width:100%;border-radius:5px 5px 0 0;min-height:3px;
  background:linear-gradient(180deg,#17a2b8,#0d5f62)}
.bar .fill.neg{background:linear-gradient(180deg,#d4685f,#8b1a1a)}
.bar .t{position:absolute;bottom:-19px;font-size:11px;color:#a8b0b6;white-space:nowrap}
.bar .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#006064;margin-bottom:4px}
.work{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#3d3d3d;line-height:2.1}
.work b{color:#006064}
/* first run: who is playing, then what the tool is for. Same pattern as the
   Module 1 game, so a student meets one convention across the whole set. */
.veil{position:fixed;inset:0;background:rgba(32,72,74,.42);z-index:70;display:none;
  align-items:center;justify-content:center;padding:20px}
.veil.on{display:flex}
.dlg{background:#fff;border-radius:10px;padding:24px 28px;max-width:560px;width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.24);border-top:3px solid #006064}
.dlg h2{font-size:16px;font-weight:700;color:#20484A;margin:0;text-transform:none;
  letter-spacing:0}
.dlg p{font-size:12.5px;line-height:1.6;color:#3d3d3d;margin:0 0 13px}
.dlg input{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;color:#20484A;text-align:center;
  padding:9px 12px;border:1px solid #8FC8CA;border-radius:999px;outline:none}
.dlg input:focus{border-color:#006064}
.dlg .go2{margin-top:11px;width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%);border:0;
  border-radius:999px;padding:9px 0;cursor:pointer}
.dlg .skip{background:none;border:0;color:#9aa5a8;font-size:11px;margin-top:7px;
  width:100%;cursor:pointer;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:8px}
.ring{position:relative;flex:0 0 auto;width:36px;height:36px;padding:0;border:0;
  background:none;cursor:pointer}
.ring span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#006064}
.ring:hover span{color:#E2231A}
.introbox{background:rgba(143,200,202,.14);border-left:3px solid #8FC8CA;
  border-radius:0 6px 6px 0;padding:13px 15px;margin-bottom:4px}
.introart{margin:0 0 12px}
.introbox li{font-size:12.5px;line-height:1.6;color:#3d3d3d;margin-bottom:7px;
  list-style:none;padding-left:14px;position:relative}
.introbox li:last-child{margin-bottom:0}
.introbox li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
  border-radius:999px;background:#8FC8CA}
.introbox b{color:#20484A}
.whois{position:absolute;right:16px;top:9px;display:flex;align-items:center}
.whois .ul{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;background:#006064;border-radius:999px 0 0 999px;padding:3px 8px 3px 10px;
  display:inline-flex;align-items:center;gap:5px}
.whois .un{font-size:11px;font-weight:700;color:#006064;background:#eef6f6;
  border:1px solid #8FC8CA;border-left:0;border-radius:0 999px 999px 0;padding:2px 11px}

/* The shared .viz is flex:1 and centres its child, which is right for a tool
   whose picture should fill the panel. The five places here are a fixed 210px
   row, so on a tall screen that left 545px of measured dead space above them.
   Hold the row at the top of the panel instead. Scoped to this tool. */
.viz{flex:0 0 auto;align-items:flex-start;padding-top:16px;padding-bottom:16px}

.year{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;margin:0 0 10px;
  border-radius:6px;background:rgba(0,96,100,.07);border-left:3px solid #006064}
.year .yk{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#a8b0b6}
.year .yv{font-size:22px;font-weight:600;color:#006064;line-height:1}
.year .yv span{font-size:12.5px;font-weight:400;color:#a8b0b6}
.year .ybar{flex:1 0 100%;height:4px;border-radius:999px;background:rgba(0,96,100,.14);overflow:hidden}
.year .ybar i{display:block;height:100%;background:#006064;border-radius:999px;transition:width .18s}
.year.over{background:rgba(139,26,26,.07);border-left-color:#8b1a1a}
.year.over .yv{color:#8b1a1a}
.year.over .ybar i{background:#8b1a1a}

/* the eight places */
.vwrap{width:100%}
.places{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:0 0 16px}
.pl{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:15px 10px 10px;text-align:center;
  position:relative}
.pl.fav{border:2px solid #006064;padding:14px 9px 9px}
.pl .ic{width:26px;height:26px;display:block;margin:0 auto 5px;color:#006064}
.pl .nm{font-size:11px;color:#20484A;font-weight:700;line-height:1.3;min-height:26px}
.pl .sc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:#006064;margin:5px 0 1px;line-height:1}
.pl .sc.none{color:#8FC8CA}
.pl .ct{font-size:10.5px;color:#a8b0b6;margin-bottom:7px}
.pl button{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;cursor:pointer;
  padding:6px 4px;border-radius:999px;border:1px solid #8FC8CA;background:#fff;color:#006064}
.pl button:hover{background:#006064;color:#fff;border-color:#006064}
.pl button[disabled]{opacity:.4;cursor:not-allowed}
.pl .new{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;
  font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;
  background:#006064;color:#fff;white-space:nowrap}

/* one tick per lunch, so a student sees the shape of their own year */
.strip{display:flex;gap:1px;flex-wrap:wrap;margin:0 0 4px}
.strip i{width:7px;height:14px;border-radius:1px;background:#EDF1F2}
.strip i.ex{background:#006064}
.strip i.ep{background:#8FC8CA}
.key{font-size:10.5px;color:#a8b0b6}
.key b{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 9px}

.cmp{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.cmp th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  color:#a8b0b6;font-weight:700;padding:0 0 5px}
.cmp td{padding:4px 0;border-top:1px solid #E4E9EB;color:#3d3d3d}
.cmp td.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;font-weight:700;color:#20484A}
.cmp tr.you td{color:#006064}
.cmp tr.you td.n{color:#006064}
</style></head><body><div class="band"><h1>The lunch year</h1><div class="sub">Module 1 &middot; exploration and exploitation, with a deadline</div></div><div class="stage"><div class="tabs"><button class="tab on" data-t="play" type="button">Your year</button><button class="tab" data-t="truth" type="button">The answer</button></div><div class="cols"><div class="side"><div class="card rule" id="controls"></div><div class="card rule" id="says"></div><div class="card rule" id="try"></div></div><div class="main"><div class="card eq" id="eq"></div><div class="viz" id="viz"></div><div class="reading" id="reading"></div><div class="reads" id="reads"></div></div></div></div><div class="foot">IE7295: Applied Reinforcement Learning &middot; Prof. Dehghani</div><div class="veil" id="name-veil"><div class="dlg"><h2>Before you start</h2><p>Put your name in so it appears on the tool. Any screenshot you take for an assignment will then carry it.</p><input type="text" id="name-in" maxlength="40" placeholder="Your name" autocomplete="name" spellcheck="false"><button class="go2" type="button" id="name-go">Start</button><button class="skip" type="button" id="name-skip">Skip</button></div></div><div class="veil" id="intro-veil"><div class="dlg"><div class="dlg-head"><h2 id="intro-hi">How this works</h2><button class="ring" id="intro-skip" type="button" aria-label="Skip"><svg viewBox="0 0 36 36" width="36" height="36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="#dfe8e9" stroke-width="3"/><circle id="intro-ring" cx="18" cy="18" r="15.5" fill="none" stroke="#006064" stroke-width="3" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><span id="intro-count">10</span></button></div><div class="introbox" id="intro-body"></div><button class="go2" type="button" id="intro-go">Got it</button></div></div><script>
var INTRO = ['The lunch year', [
  'You get <b>100 lunches</b> this year, and there are five places near campus.',
  'Each one has a quality you cannot see. The only way to learn a place is to <b>eat there</b>, and a lunch spent trying somewhere new is a lunch not spent somewhere you already like.',
  'No settings, no dial. Just pick where you eat, one lunch at a time.',
  'The interesting question is not whether to explore. It is <b>when to stop</b>.'
]];

var DAYS = 100;
// Five, not eight. MD: too many restaurants. Five still needs real exploring
// inside a hundred lunches, and the cards stay big enough to read.
var NAMES = ['Noodle bar','Taco truck','Sushi counter','Burger joint','Salad bar'];

// Drawn line icons, one per place. No emoji anywhere in this course.
var ICONS = [
  // noodle bowl with steam
  '<path d="M3 13h18a9 9 0 0 1-18 0z"/><path d="M8 8c0-1.2 1-1.4 1-2.5S8 4 8 4"/>'+
  '<path d="M12 8c0-1.2 1-1.4 1-2.5S12 4 12 4"/><path d="M16 8c0-1.2 1-1.4 1-2.5S16 4 16 4"/>',
  // taco shell
  '<path d="M3 17a9 9 0 0 1 18 0z"/><path d="M7.5 17c0-2 1.5-3.5 2.5-4"/>'+
  '<path d="M14 13c1 .5 2.5 2 2.5 4"/>',
  // sushi, rice roll seen end on
  '<rect x="3.5" y="7.5" width="17" height="9" rx="4.5"/><circle cx="12" cy="12" r="2.4"/>',
  // burger, stacked
  '<path d="M3.5 9.5a8.5 8.5 0 0 1 17 0z"/><path d="M3.5 12.5h17"/>'+
  '<path d="M4.5 15.5h15a4 4 0 0 1-4 3h-7a4 4 0 0 1-4-3z"/>',
  // salad bowl with leaves
  '<path d="M3 13h18a9 9 0 0 1-18 0z"/><path d="M9 10c-2-1-2.5-3-1-4 1.5 1 2 2.5 1 4z"/>'+
  '<path d="M14 10c2-1 2.5-3 1-4-1.5 1-2 2.5-1 4z"/>'
];
function foodIcon(i){
  return '<svg viewBox="0 0 24 24" class="ic" fill="none" stroke="currentColor" '+
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+ICONS[i]+'</svg>';
}

var S = { tab:'play', day:0, total:0, mu:[], n:[], sum:[], log:[], best:0 };

function gauss(){                       // Box-Muller, so ratings are noisy
  var u = 1 - Math.random(), v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}
function newYear(){
  S.day = 0; S.total = 0; S.log = [];
  S.mu = []; S.n = []; S.sum = [];
  for (var i=0;i<NAMES.length;i++){
    S.mu.push(4.6 + Math.random()*4.2);
    S.n.push(0); S.sum.push(0);
  }
  S.best = 0;
  for (var j=1;j<S.mu.length;j++) if (S.mu[j] > S.mu[S.best]) S.best = j;
}
function left(){ return Math.max(0, DAYS - S.day); }
function over(){ return left() === 0; }
function est(i){ return S.n[i] ? S.sum[i]/S.n[i] : null; }
function fav(){                          // best place by YOUR estimate, not the truth
  var b = -1;
  for (var i=0;i<S.mu.length;i++)
    if (S.n[i] && (b < 0 || est(i) > est(b))) b = i;
  return b;
}
function rate(i){
  var r = S.mu[i] + gauss()*1.15;
  return Math.max(0, Math.min(10, r));
}
function go(i){
  if (over()) return;
  var first = (S.n[i] === 0);
  var r = rate(i);
  S.n[i] += 1; S.sum[i] += r; S.total += r; S.day += 1;
  S.log.push(first ? 1 : 0);             // 1 = explored, 0 = exploited
  render();
}
function stick(i, times){
  for (var t=0; t<times && !over(); t++){
    var r = rate(i);
    S.n[i] += 1; S.sum[i] += r; S.total += r; S.day += 1;
    S.log.push(0);
  }
  render();
}

// ---- what other strategies would have scored on THIS year ----
function simulate(pick, runs){
  var tot = 0;
  for (var r=0;r<runs;r++){
    var n=[], sum=[], t=0;
    for (var i=0;i<S.mu.length;i++){ n.push(0); sum.push(0); }
    for (var d=0; d<DAYS; d++){
      var c = pick(d, n, sum);
      var v = Math.max(0, Math.min(10, S.mu[c] + gauss()*1.15));
      n[c]+=1; sum[c]+=v; t+=v;
    }
    tot += t;
  }
  return tot/runs;
}
function bestKnown(n, sum){
  var b=-1;
  for (var i=0;i<n.length;i++) if (n[i] && (b<0 || sum[i]/n[i] > sum[b]/n[b])) b=i;
  return b < 0 ? 0 : b;
}
function greedyPick(d, n, sum){
  if (d === 0) return Math.floor(Math.random()*n.length);
  return bestKnown(n, sum);
}
function epsPick(e){
  return function(d, n, sum){
    if (Math.random() < e) return Math.floor(Math.random()*n.length);
    return bestKnown(n, sum);
  };
}
function decayPick(d, n, sum){
  if (Math.random() < 1/(1 + d*0.16)) return Math.floor(Math.random()*n.length);
  return bestKnown(n, sum);
}

function strip(){
  var s = '<div class="strip">';
  for (var i=0;i<DAYS;i++){
    var c = i < S.log.length ? (S.log[i] ? ' class="ep"' : ' class="ex"') : '';
    s += '<i' + c + '></i>';
  }
  return s + '</div><div class="key">your year, one tick per lunch' +
    '<b style="background:' + MISTC + '"></b>tried somewhere new' +
    '<b style="background:' + TEALC + '"></b>went back to a favourite</div>';
}
var TEALC = '#006064', MISTC = '#8FC8CA';

function drawPlaces(){
  var f = fav();
  var h = '<div class="places">';
  for (var i=0;i<NAMES.length;i++){
    var e = est(i);
    h += '<div class="pl' + (i===f ? ' fav' : '') + '">' +
      (S.n[i]===0 ? '<span class="new">never tried</span>' : '') +
      foodIcon(i) +
      '<div class="nm">' + NAMES[i] + '</div>' +
      '<div class="sc' + (e===null ? ' none' : '') + '">' +
        (e===null ? '?' : e.toFixed(1)) + '</div>' +
      '<div class="ct">' + (S.n[i]===0 ? 'no idea' :
         S.n[i] + (S.n[i]===1 ? ' lunch' : ' lunches')) + '</div>' +
      '<button type="button" onclick="go(' + i + ')"' + (over()?' disabled':'') +
        '>Eat here</button></div>';
  }
  $('viz').innerHTML = '<div class="vwrap">' + h + '</div>' + strip() + '</div>';
  tiles();
}

function tiles(){
  var tried = 0, f = fav();
  for (var i=0;i<S.n.length;i++) if (S.n[i]) tried++;
  var ex = 0;
  for (var j=0;j<S.log.length;j++) if (S.log[j]) ex++;
  $('reads').innerHTML = reads([
    ['lunches left', String(left()), left()<=12 ? 'warn' : ''],
    ['eaten so far', S.total.toFixed(0), ''],
    ['places tried', tried + ' of ' + S.n.length, tried < 3 ? 'warn' : ''],
    ['your favourite', f < 0 ? '-' : est(f).toFixed(1), f >= 0 ? 'on' : '']
  ]);
}

function drawTruth(){
  var rows = '', f = fav();
  var order = [];
  for (var i=0;i<NAMES.length;i++) order.push(i);
  order.sort(function(a,b){ return S.mu[b]-S.mu[a]; });
  rows += '<table class="cmp"><tr><th>Place</th><th style="text-align:right">Really worth</th>' +
          '<th style="text-align:right">You thought</th><th style="text-align:right">Lunches</th></tr>';
  for (var k=0;k<order.length;k++){
    var i = order[k], e = est(i);
    rows += '<tr' + (i===f ? ' class="you"' : '') + '><td>' + NAMES[i] +
      (i===S.best ? ' <b style="color:' + TEALC + '">best</b>' : '') + '</td>' +
      '<td class="n">' + S.mu[i].toFixed(1) + '</td>' +
      '<td class="n">' + (e===null ? 'never went' : e.toFixed(1)) + '</td>' +
      '<td class="n">' + S.n[i] + '</td></tr>';
  }
  rows += '</table>';
  $('viz').innerHTML = '<div class="vwrap">' + rows +
    '<div style="margin-top:16px">' + strip() + '</div></div>';
  tiles();
}

function readPlay(){
  var tried = 0;
  for (var i=0;i<S.n.length;i++) if (S.n[i]) tried++;
  if (!S.day) return 'Five places, <b>' + DAYS + '</b> lunches, and every score is a ' +
    '<b>?</b> until you go. Pick one.';
  var f = fav(), l = left();
  if (over()) return 'The year is over. You ate <b>' + S.total.toFixed(0) + '</b> worth of ' +
    'lunch across ' + DAYS + ' of them, and tried <b>' + tried + '</b> of the five places. ' +
    'Open <b>The answer</b> to see what each place was really worth.';
  var s = 'Lunch <b>' + S.day + '</b> of ' + DAYS + '. Your favourite so far is <b>' +
    NAMES[f] + '</b> at <b>' + est(f).toFixed(1) + '</b>' +
    (S.n[f] === 1 ? ', on a single lunch, which is almost no evidence at all' : '') +
    ', and you have <b>' + l + '</b> lunches left. ';
  if (tried < S.n.length && l > 40)
    s += 'You have not tried <b>' + (S.n.length - tried) + '</b> of them, and there is ' +
         'plenty of year left to find out.';
  else if (tried < S.n.length && l > 12)
    s += 'There are still <b>' + (S.n.length - tried) + '</b> you have never tried. ' +
         'A new place has to be good enough to pay back the lunch it costs.';
  else if (l <= 12)
    s += 'With this little of the year left, a gamble has almost no time to pay off.';
  else
    s += 'You have been everywhere. Now it is only a question of who is really best.';
  return s;
}

function ctlPlay(){
  var f = fav(), l = left();
  var h = '<div class="year' + (over()?' over':'') + '">' +
    '<div class="yk">Lunches left</div><div class="yv">' + l + '<span>/' + DAYS + '</span></div>' +
    '<div class="ybar"><i style="width:' + (l/DAYS*100) + '%"></i></div></div>';
  if (over()){
    h += '<div class="box" style="font-size:11.5px;line-height:1.6;padding:9px 11px;' +
         'margin:0 0 9px;border-radius:0 6px 6px 0;border-left:3px solid ' + TEALC + ';' +
         'background:rgba(0,96,100,.07)">Year over. See <b>The answer</b>, then run ' +
         'another one and spend your lunches differently.</div>';
  } else if (f >= 0 && S.n[f] > 1){
    h += button('Stick with ' + NAMES[f] + ' for 10', 'stick(' + f + ',10)', 'go');
  }
  h += button('New year', 'newYear();render()');
  return h;
}

function ctlTruth(){
  if (!S.day) return '<div class="hint">Eat some lunches first, then come back.</div>';
  var mine = S.total;
  var rows = [
    ['Always your favourite', simulate(greedyPick, 24), 'never tries anything new'],
    ['Explore 10% of the time', simulate(epsPick(0.10), 24), 'a fixed habit'],
    ['Explore 30% of the time', simulate(epsPick(0.30), 24), 'still gambling in December'],
    ['Explore less as the year runs out', simulate(decayPick, 24), 'looks early, commits late']
  ];
  var bestPossible = S.mu[S.best] * DAYS;
  var h = '<table class="cmp"><tr><th>Over a whole year</th><th style="text-align:right">Total</th></tr>' +
    '<tr class="you"><td>You' + (over() ? '' : ', so far') + '</td><td class="n">' +
    mine.toFixed(0) + (over() ? '' : ' of ' + S.day) + '</td></tr>';
  for (var i=0;i<rows.length;i++)
    h += '<tr><td>' + rows[i][0] + '<div style="font-size:10.5px;color:#a8b0b6">' +
         rows[i][2] + '</div></td><td class="n">' + rows[i][1].toFixed(0) + '</td></tr>';
  h += '<tr><td>Knowing the answer all along</td><td class="n">' +
       bestPossible.toFixed(0) + '</td></tr></table>';
  return h;
}

function readTruth(){
  var f = fav();
  if (!S.day) return 'Nothing to reveal yet.';
  var right = (f === S.best);
  var missed = 0;
  for (var i=0;i<S.n.length;i++) if (!S.n[i]) missed++;
  return 'The best place was <b>' + NAMES[S.best] + '</b> at <b>' + S.mu[S.best].toFixed(1) +
    '</b>. ' + (right ? 'You found it. ' : 'You settled on <b>' + NAMES[f] + '</b> instead. ') +
    (missed ? 'You never tried <b>' + missed + '</b> of the five, so those scores were ' +
              'always going to be a guess. ' : 'You tried all five. ') +
    'Compare the totals on the left: the strategy that looks around early and commits ' +
    'later beats both the one that never explores and the one that never stops.';
}

var TABS = {
  play: {
    eq: null,
    says: ['A year of lunches', 'Every place pays out around a quality you cannot see. ' +
           'The only way to learn one is to spend a lunch on it, and the year does ' +
           'not last forever.'],
    steps: ['Try a few places. One visit tells you very little, because the same ' +
            'kitchen has good days and bad days.',
            'Settle toward whichever looks best, and watch the ticks under the ' +
            'places fill in.',
            'Near the end, ask whether a new place can still pay for itself.',
            'Open <b>The answer</b> to see what every place was really worth.'],
    read: readPlay, controls: ctlPlay, draw: drawPlaces
  },
  truth: {
    eq: null,
    says: ['What the places were really worth',
           'The quality column is what you were sampling all along. A place you ' +
           'visited twice could be anywhere near its real score.'],
    steps: ['Look at the places you tried once. Your estimate and the truth can be ' +
            'far apart on a single lunch.',
            'Look at the ones you never tried. Any of them could have been the best.',
            'Compare the totals on the left, then run another year.'],
    read: readTruth, controls: ctlTruth, draw: drawTruth
  }
};

function onInput(id, val){ render(); }
newYear();

var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint, step){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" step="' + (step || 1) + '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (String(p[0]) === String(sel) ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function button(label, fn, kind){
  return '<button class="btn ' + (kind || '') + '" type="button" onclick="' + fn +
         '">' + label + '</button>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' ' + it[2] : '') + '"><div class="k">' +
           it[0] + '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}
var FLIP = {};                       // which tabs are currently showing the back

function flipEq(){
  FLIP[S.tab] = !FLIP[S.tab];
  render();
}
function eqButton(){
  var back = FLIP[S.tab];
  var icon = back
    ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
      'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.2 3.1c-.6.3-.8.7-.8 1.3v.4"/>' +
      '<path d="M12 17.4h.01"/></svg>';
  return '<button class="eq-flip" type="button" onclick="flipEq()" title="' +
         (back ? 'Back to the equation' : 'What does this mean?') + '">' + icon + '</button>';
}

// Rewriting a panel that has not changed destroys whatever the pointer is on,
// which is why Stop could not be clicked while a tool was running.
function setIf(id, html){
  var el = $(id);
  if (el.innerHTML !== html) el.innerHTML = html;
}

function render(){
  var t = TABS[S.tab];
  if (t.eq) {
    $('eq').style.display = '';
    if (FLIP[S.tab] && t.explain){
      $('eq').className = 'card eq back';
      $('eq').innerHTML = eqButton() +
        '<div class="lead">' + t.explain[0] + '</div><div class="terms">' +
        t.explain[1].map(function(x){
          return '<b>' + x[0] + '</b><span>' + x[1] + '</span>'; }).join('') +
        '</div>';
    } else {
      $('eq').className = 'card eq';
      $('eq').innerHTML = (t.explain ? eqButton() : '') +
        '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
    }
  } else { $('eq').style.display = 'none'; }
  setIf('says', '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>');
  setIf('try', '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>');
  setIf('controls', '<h2>Controls</h2>' + t.controls());
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement && t.eq && !(FLIP[S.tab] && t.explain)){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}
document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      var on = document.querySelector('.tab.on');
      if (on) on.classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      if (typeof onTab === 'function') onTab(S.tab);
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});

/* ---- who is playing, and what this is ---------------------------------
   Asked once, remembered after that. The name goes on the band so it lands
   inside any screenshot a student takes for an assignment. INTRO is set by
   each tool: a title and the four lines worth knowing before starting. */
(function(){
  var USER = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/>' +
    '<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  var nameVeil = $('name-veil'), introVeil = $('intro-veil'),
      input = $('name-in'), band = document.querySelector('.band');
  var timer = null, LEN = 97.4, SECS = (window.INTRO_SECS || 15);

  function show(n){
    var slot = document.getElementById('whois');
    if (!slot){
      slot = document.createElement('div');
      slot.className = 'whois'; slot.id = 'whois';
      band.appendChild(slot);
    }
    slot.innerHTML = n ? '<span class="ul">' + USER + 'User</span>' +
                         '<span class="un"></span>' : '';
    if (n) slot.querySelector('.un').textContent = n;
    var hi = $('intro-hi');
    if (hi && window.INTRO) hi.textContent = n ? 'Say hi, ' + n : INTRO[0];
  }
  function closeIntro(){
    if (timer){ clearInterval(timer); timer = null; }
    introVeil.classList.remove('on');
  }
  function openIntro(){
    if (!window.INTRO) return;
    $('intro-body').innerHTML =
      (INTRO[2] ? '<div class="introart">' + INTRO[2] + '</div>' : '') +
      '<ul style="margin:0;padding:0">' +
      INTRO[1].map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
    introVeil.classList.add('on');
    var left = SECS;
    $('intro-count').textContent = left;
    $('intro-ring').style.strokeDashoffset = 0;
    timer = setInterval(function(){
      left -= 1;
      $('intro-count').textContent = Math.max(0, left);
      $('intro-ring').style.strokeDashoffset = LEN * (SECS - left) / SECS;
      if (left <= 0) closeIntro();
    }, 1000);
  }
  function done(){
    var n = input.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    try { if (n) localStorage.setItem('ie7295-name', n); } catch (e) {}
    show(n);
    nameVeil.classList.remove('on');
    openIntro();
  }
  $('name-go').addEventListener('click', done);
  $('name-skip').addEventListener('click', function(){
    nameVeil.classList.remove('on'); openIntro();
  });
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') done(); });
  $('intro-go').addEventListener('click', closeIntro);
  $('intro-skip').addEventListener('click', closeIntro);
  introVeil.addEventListener('click', function(e){ if (e.target === introVeil) closeIntro(); });

  var saved = null;
  try { saved = localStorage.getItem('ie7295-name'); } catch (e) {}
  if (saved){ show(saved); openIntro(); }          // known already, straight to the intro
  else { nameVeil.classList.add('on'); setTimeout(function(){ input.focus(); }, 60); }
})();

</script></body></html>
