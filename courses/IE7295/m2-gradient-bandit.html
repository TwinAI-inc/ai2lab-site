<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gradient Bandit - IE 7295</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#3d3d3d;font-size:12.5px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}

.band{flex:0 0 auto;background:linear-gradient(135deg,#C3E3E4 0%,#C1E2E3 100%);
  padding:9px 16px;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;

.band h1{margin:0;font-size:16px;font-weight:700;color:#20484A}
.band .sub{display:inline-block;background:rgba(255,255,255,.75);color:#3d5f61;
  padding:2px 9px;border-radius:999px;font-size:11px;margin-top:3px}
.foot{flex:0 0 auto;border-top:1px solid #E4E9EB;background:#fff;padding:8px 16px;
  text-align:center;font-size:11px;color:#a8b0b6}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  padding:10px 14px}
.tabs{flex:0 0 auto;display:inline-flex;background:#fff;border:1px solid #E4E9EB;
  border-radius:999px;padding:3px;align-self:flex-start}
.tab{font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:700;color:#5b7175;background:none;
  border:0;border-radius:999px;padding:7px 20px;cursor:pointer;white-space:nowrap}

.cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:264px 1fr;gap:10px}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;
  padding-right:2px}
.main{display:flex;flex-direction:column;gap:9px;min-height:0}

.card{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:10px 12px}
.card.rule{border-left:3px solid #8FC8CA;border-radius:0 6px 6px 0}
h2{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#006064;margin:0 0 6px}

.ctl{margin-bottom:9px}
.ctl:last-child{margin-bottom:0}
.ctl .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:11px;font-weight:700;color:#20484A;margin-bottom:2px}
.ctl .val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;color:#006064;
  background:#eef6f6;border-radius:999px;padding:1px 9px}
.ctl .hint{font-size:10px;color:#a8b0b6;margin-top:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;
  border-radius:999px;margin:6px 0 0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#0d5f62 0%,#17a2b8 var(--f,0%),
             #e2e9ea var(--f,0%),#e2e9ea 100%)}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-5px;
  width:20px;height:20px;border-radius:999px;background:#fff;border:2px solid #006064;
  box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:10px;background:transparent}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:999px;
  background:#fff;border:2px solid #006064;box-shadow:0 1px 4px rgba(0,0,0,.18)}
select{width:100%;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:12px;color:#20484A;background:#fff;
  border:1px solid #E4E9EB;border-radius:6px;padding:7px 9px;margin-top:5px;cursor:pointer}
select:focus{outline:none;border-color:#8FC8CA}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.btn{flex:1 1 0;min-width:76px;font-family:Lato,'Lato Extended','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:7px 0;cursor:pointer;border:1px solid #E4E9EB;
  background:#fff;color:#20484A}
.btn:hover{border-color:#8FC8CA;background:#eef6f6}
.btn.go{border:0;color:#fff;background:linear-gradient(135deg,#006064 0%,#17a2b8 100%)}
.btn.stop{border:0;color:#fff;background:linear-gradient(135deg,#8b1a1a 0%,#b8433f 100%)}
.btn:disabled{background:#eef1f2;color:#9aa8ae;cursor:not-allowed;border-color:#E4E9EB}

.eq{background:rgba(143,200,202,.13);border-left:3px solid #8FC8CA;border-radius:0 6px 6px 0;
  padding:11px 15px;text-align:center}
.eq .cap{font-size:11px;color:#3d3d3d;margin-top:6px}
.viz{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #E4E9EB;border-radius:6px;
  padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reading{flex:0 0 auto;background:rgba(0,96,100,.07);border-left:3px solid #006064;
  border-radius:0 6px 6px 0;padding:9px 14px;font-size:12px;line-height:1.55;color:#3d3d3d}
.reading b{color:#006064;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.reads{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.read{background:#fff;border:1px solid #E4E9EB;border-radius:6px;padding:8px 11px}
.read .k{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#a8b0b6}
.read .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:#20484A;margin-top:1px}
.read.on .v{color:#006064}
.read.warn .v{color:#8b1a1a}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:20px;margin-bottom:5px;
  font-size:10.5px;line-height:1.45;color:#3d3d3d}
.steps li:last-child{margin-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:15px;
  height:15px;border-radius:999px;background:#006064;color:#fff;font-size:9.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.katex{font-size:1.05em}

/* pieces individual tools draw with, all from the same palette */
.tile{border:1px solid #E4E9EB;border-radius:6px;background:#f7f9f9;display:flex;
  flex-direction:column;align-items:center;justify-content:center;transition:all .18s}
.tile .k{font-size:10px;color:#a8b0b6}
.tile .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;color:#20484A}
.tile.on{border:2px solid #006064;background:#eef6f6}
.tile.best{border:2px solid #2e9e6b;background:rgba(0,150,90,.10)}
.tile.best .v{color:#1d6b4a}
.tile.bad{border:2px solid #E2231A;background:rgba(226,35,26,.08)}
.tile.bad .v{color:#8b1a1a}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:100%;
  width:100%;padding-bottom:22px}
.bar{flex:1;max-width:92px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
.bar .fill{width:100%;border-radius:5px 5px 0 0;min-height:3px;
  background:linear-gradient(180deg,#17a2b8,#0d5f62)}
.bar .fill.neg{background:linear-gradient(180deg,#d4685f,#8b1a1a)}
.bar .t{position:absolute;bottom:-19px;font-size:11px;color:#a8b0b6;white-space:nowrap}
.bar .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#006064;margin-bottom:4px}
.work{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#3d3d3d;line-height:2.1}
.work b{color:#006064}
</style></head><body><div class="band"><h1>Gradient Bandit</h1><div class="sub">Module 2 &middot; preferences, softmax, and one reward moving all of them</div></div><div class="stage"><div class="tabs"><button class="tab on" data-t="soft" type="button">Softmax</button><button class="tab" data-t="update" type="button">The update</button></div><div class="cols"><div class="side"><div class="card rule" id="controls"></div><div class="card rule" id="says"></div><div class="card rule" id="try"></div></div><div class="main"><div class="card eq" id="eq"></div><div class="viz" id="viz"></div><div class="reading" id="reading"></div><div class="reads" id="reads"></div></div></div></div><div class="foot">IE7295: Applied Reinforcement Learning &middot; Prof. Dehghani</div><script>
var S = {
  tab: 'soft', arms: 4, alpha: 10, temp: 100,
  H: [], P: [], mu: [], baseline: 0, steps: 0, picked: -1, lastR: 0,
  autoOn: false, autoT: null
};

function reset(){
  S.H = []; S.mu = [];
  for (var i = 0; i < S.arms; i++){
    S.H.push(0);
    S.mu.push(Math.round((Math.random() * 4 - 1) * 100) / 100);
  }
  S.baseline = 0; S.steps = 0; S.picked = -1; S.lastR = 0;
  softmax();
  stopAuto();
}
function softmax(){
  var t = Math.max(0.1, S.temp / 100);
  var m = Math.max.apply(null, S.H);
  var e = S.H.map(function(h){ return Math.exp((h - m) / t); });   // shifted, so no overflow
  var sum = e.reduce(function(a, b){ return a + b; }, 0);
  S.P = e.map(function(x){ return x / sum; });
}
function sample(){
  var r = Math.random(), c = 0;
  for (var i = 0; i < S.arms; i++){ c += S.P[i]; if (r <= c) return i; }
  return S.arms - 1;
}
function step(){
  var a = sample();
  var R = S.mu[a] + (Math.random() + Math.random() + Math.random() - 1.5) * 0.9;
  var al = S.alpha / 100;
  S.steps += 1;
  S.baseline += (R - S.baseline) / S.steps;          // running average reward
  for (var i = 0; i < S.arms; i++){
    // the chosen arm rises by 1 - P, every other falls by its own P
    S.H[i] += al * (R - S.baseline) * ((i === a ? 1 : 0) - S.P[i]);
  }
  softmax();
  S.picked = a; S.lastR = R;
  render();
}
function stopAuto(){ S.autoOn = false; if (S.autoT){ clearInterval(S.autoT); S.autoT = null; } }
function toggleAuto(){
  if (S.autoOn){ stopAuto(); render(); return; }
  S.autoOn = true;
  S.autoT = setInterval(function(){
    if (S.steps >= 400){ stopAuto(); render(); return; }
    step();
  }, 60);
  render();
}
function onInput(id, val){
  if (id === 'arms'){ S.arms = +val; reset(); }
  if (id === 'alpha') S.alpha = +val;
  if (id === 'temp'){ S.temp = +val; softmax(); }
  render();
}
function onTab(){ stopAuto(); }

function best(){ return S.mu.indexOf(Math.max.apply(null, S.mu)); }

/* preferences on the left, probabilities on the right, so the softmax is a
   thing you watch happen rather than a formula you are told about */
function drawSoft(){
  var span = Math.max(1.2, Math.max.apply(null, S.H.map(Math.abs)) * 1.15);
  $('viz').innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;width:100%;' +
    'max-width:860px;align-items:center">' +

    '<div><div style="font-size:10px;font-weight:700;letter-spacing:.5px;' +
      'text-transform:uppercase;color:#a8b0b6;text-align:center;margin-bottom:8px">' +
      'preference H(a)</div>' +
      S.H.map(function(h, i){
        var w = (Math.abs(h) / span) * 50;
        var pos = h >= 0;
        return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">' +
          '<div style="width:38px;font-size:10px;color:#a8b0b6">arm ' + (i + 1) + '</div>' +
          '<div style="flex:1;height:17px;position:relative;background:#f2f5f6;' +
            'border-radius:4px">' +
            '<div style="position:absolute;left:50%;top:0;bottom:0;width:1px;' +
              'background:#d4dcde"></div>' +
            '<div style="position:absolute;top:2px;bottom:2px;border-radius:3px;' +
              (pos ? 'left:50%;' : 'right:50%;') + 'width:' + w.toFixed(1) + '%;' +
              'background:' + (pos ? '#17a2b8' : '#c0504d') + '"></div>' +
          '</div>' +
          '<div style="width:46px;font-family:ui-monospace,Menlo,monospace;font-size:11px;' +
            'font-weight:700;color:#20484A;text-align:right">' + h.toFixed(2) + '</div>' +
        '</div>';
      }).join('') + '</div>' +

    '<div><div style="font-size:10px;font-weight:700;letter-spacing:.5px;' +
      'text-transform:uppercase;color:#a8b0b6;text-align:center;margin-bottom:8px">' +
      'probability &pi;(a)</div>' +
      S.P.map(function(p, i){
        var w = p * 100;
        return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">' +
          '<div style="flex:1;height:17px;background:#f2f5f6;border-radius:4px;' +
            'overflow:hidden"><div style="height:100%;width:' + w.toFixed(1) + '%;' +
            'background:linear-gradient(90deg,#0d5f62,#17a2b8);border-radius:4px"></div></div>' +
          '<div style="width:46px;font-family:ui-monospace,Menlo,monospace;font-size:11px;' +
            'font-weight:700;color:' + (i === S.picked ? '#006064' : '#20484A') +
            ';text-align:right">' + (p * 100).toFixed(1) + '%</div>' +
        '</div>';
      }).join('') + '</div></div>';

  var b = best();
  $('reads').innerHTML = reads([
    ['steps', String(S.steps), ''],
    ['baseline', S.baseline.toFixed(2), 'on'],
    ['prob on best arm', (S.P[b] * 100).toFixed(0) + '%', S.P[b] > 0.6 ? 'on' : ''],
    ['last reward', S.steps ? S.lastR.toFixed(2) : '-',
      S.steps && S.lastR < S.baseline ? 'warn' : '']
  ]);
}

var TABS = {
  soft: {
    eq: '\\pi_t(a) = \\frac{e^{H_t(a)}}{\\sum_b e^{H_t(b)}}',
    cap: 'Preferences are not probabilities. Softmax turns one into the other.',
    says: ['Preferences, not values', 'This method never estimates what an arm is ' +
           'worth. It keeps a preference, and raises or lowers it depending on ' +
           'whether the reward beat the average.'],
    steps: ['All preferences start at zero, so softmax gives every arm the same ' +
            'probability. Nothing is preferred yet.',
            'Press <b>One step</b> a few times. Watch a preference bar cross the ' +
            'centre line, and the probability bar beside it grow.',
            'Drag <b>temperature</b> down to 0.20. The same preferences now produce ' +
            'far sharper probabilities: the agent commits harder on the same evidence.',
            'Press <b>Run</b> and watch <b>&pi; on best arm</b> climb. Stalling below ' +
            '100% is softmax keeping some exploration alive on purpose.'],
    read: function(){
      if (!S.steps) return 'Every preference is <b>0.00</b>, so softmax spreads ' +
        'probability evenly at <b>' + (100 / S.arms).toFixed(0) + '%</b> each. ' +
        'Until something is tried there is no reason to prefer anything.';
      var b = best(), lead = S.P.indexOf(Math.max.apply(null, S.P));
      var beat = S.lastR > S.baseline;
      return 'The last pull paid <b>' + S.lastR.toFixed(2) + '</b> against a baseline ' +
        'of <b>' + S.baseline.toFixed(2) + '</b>, so arm <b>' + (S.picked + 1) +
        '</b> was pushed ' + (beat ? '<b>up</b> and every other arm down. '
                                   : '<b>down</b> and every other arm up. ') +
        'Arm <b>' + (lead + 1) + '</b> now holds <b>' + (S.P[lead] * 100).toFixed(0) +
        '%</b> of the probability' +
        (lead === b ? ', and it is the genuinely best arm.'
                    : ', but the best arm is actually <b>' + (b + 1) + '</b>.');
    },
    controls: function(){
      return slider('arms', 'Number of arms', 2, 6, S.arms, function(v){ return String(v); }, '')
           + slider('alpha', 'Step size &alpha;', 1, 50, S.alpha,
                    function(v){ return (v/100).toFixed(2); },
                    'How hard each reward moves the preferences')
           + slider('temp', 'Temperature', 10, 300, S.temp,
                    function(v){ return (v/100).toFixed(2); },
                    'Low makes softmax decisive, high keeps it hesitant')
           + '<div class="btns">'
           + button(S.autoOn ? 'Stop' : 'Run', 'toggleAuto()', S.autoOn ? 'stop' : 'go')
           + button('One step', 'step()', '') + '</div>'
           + '<div class="btns">' + button('New problem', 'reset();render()', '') + '</div>';
    },
    draw: drawSoft
  },
  update: {
    eq: 'H_{t+1}(a) = H_t(a) + \\alpha\\,(R_t - \\bar{R}_t)\\,' +
        '\\big(\\mathbb{1}_{a = A_t} - \\pi_t(a)\\big)',
    cap: 'One reward moves every preference, not only the arm that earned it.',
    says: ['Why the others move too', 'Probabilities have to sum to one. Raising the ' +
           'arm you took means lowering everything else, and the amount each one ' +
           'loses is exactly its own current probability.'],
    steps: ['Take a step, then read the four numbers here. They are the pieces of ' +
            'the equation above, in order.',
            'Notice the sign of <b>R - baseline</b>. A reward below average pushes ' +
            'the chosen arm <b>down</b>, which is the method admitting a mistake.',
            'Turn <b>&alpha;</b> up to 0.50 and step again. The same reward now moves ' +
            'the preferences much further, and the run gets noisier.',
            'The baseline is just the average reward so far. Without it, every ' +
            'reward would look good and every preference would drift upward together.'],
    read: function(){
      if (!S.steps) return 'Nothing has been taken yet, so there is no reward to ' +
        'compare against a baseline and no preference has moved.';
      var d = S.lastR - S.baseline, al = S.alpha / 100;
      var moved = al * d * (1 - S.P[S.picked]);
      return 'Arm <b>' + (S.picked + 1) + '</b> paid <b>' + S.lastR.toFixed(2) +
        '</b>, the baseline is <b>' + S.baseline.toFixed(2) + '</b>, so the ' +
        'advantage is <b>' + d.toFixed(2) + '</b>. Multiplied by &alpha; = <b>' +
        al.toFixed(2) + '</b> and by (1 - &pi;) = <b>' +
        (1 - S.P[S.picked]).toFixed(2) + '</b>, its preference moved by <b>' +
        moved.toFixed(3) + '</b>. ' +
        (d >= 0 ? 'Every other arm moved the other way.'
                : 'Because the advantage was negative, the arm taken went down and ' +
                  'the others went up.');
    },
    controls: function(){
      return slider('alpha', 'Step size &alpha;', 1, 50, S.alpha,
                    function(v){ return (v/100).toFixed(2); },
                    'The multiplier on every preference move')
           + '<div class="btns">'
           + button(S.autoOn ? 'Stop' : 'Run', 'toggleAuto()', S.autoOn ? 'stop' : 'go')
           + button('One step', 'step()', '') + '</div>'
           + '<div class="btns">' + button('New problem', 'reset();render()', '') + '</div>';
    },
    draw: function(){
      var d = S.steps ? S.lastR - S.baseline : 0, al = S.alpha / 100;
      $('viz').innerHTML =
        '<div class="work" style="font-size:14px;line-height:2.4">' +
        'chosen arm &nbsp; <b>' + (S.steps ? 'A = ' + (S.picked + 1) : '-') + '</b><br>' +
        'reward &nbsp; R = <b>' + (S.steps ? S.lastR.toFixed(2) : '-') + '</b><br>' +
        'baseline &nbsp; R&#772; = <b>' + S.baseline.toFixed(2) + '</b><br>' +
        'advantage &nbsp; R - R&#772; = <b>' + (S.steps ? d.toFixed(2) : '-') + '</b><br>' +
        '<span style="color:#a8b0b6">' + '&mdash;'.repeat(18) + '</span><br>' +
        'chosen arm moves by <b>' +
          (S.steps ? (al * d * (1 - S.P[S.picked])).toFixed(3) : '-') + '</b><br>' +
        'each other arm by <b>' +
          (S.steps ? (-al * d * S.P[(S.picked + 1) % S.arms]).toFixed(3) : '-') +
        '</b> and similar</div>';
      var b = best();
      $('reads').innerHTML = reads([
        ['steps', String(S.steps), ''],
        ['advantage', S.steps ? d.toFixed(2) : '-', d < 0 ? 'warn' : 'on'],
        ['step size', al.toFixed(2), ''],
        ['prob on best arm', (S.P[b] * 100).toFixed(0) + '%', '']
      ]);
    }
  }
};
reset();

var $ = function(id){ return document.getElementById(id); };

function slider(id, label, min, max, val, fmt, hint, step){
  return '<div class="ctl"><div class="lab"><span>' + label + '</span>' +
         '<span class="val" id="v-' + id + '">' + fmt(val) + '</span></div>' +
         '<input type="range" id="' + id + '" min="' + min + '" max="' + max +
         '" step="' + (step || 1) + '" value="' + val + '">' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function picker(id, label, opts, sel, hint){
  var o = opts.map(function(p){
    return '<option value="' + p[0] + '"' + (String(p[0]) === String(sel) ? ' selected' : '') +
           '>' + p[1] + '</option>'; }).join('');
  return '<div class="ctl"><div class="lab"><span>' + label + '</span></div>' +
         '<select id="' + id + '">' + o + '</select>' +
         (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function button(label, fn, kind){
  return '<button class="btn ' + (kind || '') + '" type="button" onclick="' + fn +
         '">' + label + '</button>';
}
function reads(items){
  return items.map(function(it){
    return '<div class="read' + (it[2] ? ' ' + it[2] : '') + '"><div class="k">' +
           it[0] + '</div><div class="v">' + it[1] + '</div></div>'; }).join('');
}
function paintRange(r){
  var pct = ((+r.value - +r.min) / ((+r.max - +r.min) || 1)) * 100;
  r.style.setProperty('--f', pct + '%');
}
function wire(){
  [].forEach.call(document.querySelectorAll('input[type=range]'), function(r){
    paintRange(r);
    r.addEventListener('input', function(){ paintRange(r); onInput(r.id, +r.value); });
  });
  [].forEach.call(document.querySelectorAll('select'), function(s){
    s.addEventListener('change', function(){ onInput(s.id, s.value); });
  });
}
function render(){
  var t = TABS[S.tab];
  if (t.eq) {
    $('eq').style.display = '';
    $('eq').innerHTML = '$$' + t.eq + '$$<div class="cap">' + t.cap + '</div>';
  } else { $('eq').style.display = 'none'; }
  $('says').innerHTML = '<h2>' + t.says[0] + '</h2>' +
    '<div style="font-size:11.5px;line-height:1.6;color:#3d3d3d">' + t.says[1] + '</div>';
  $('try').innerHTML = '<h2>Try this</h2><ol class="steps">' +
    t.steps.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ol>';
  $('controls').innerHTML = '<h2>Controls</h2>' + t.controls();
  t.draw();
  $('reading').innerHTML = t.read();
  wire();
  if (window.renderMathInElement && t.eq){
    renderMathInElement($('eq'), {
      delimiters: [{left:'$$', right:'$$', display:true}], throwOnError:false});
  }
}
document.addEventListener('DOMContentLoaded', function(){
  [].forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      var on = document.querySelector('.tab.on');
      if (on) on.classList.remove('on');
      b.classList.add('on');
      S.tab = b.dataset.t;
      if (typeof onTab === 'function') onTab(S.tab);
      render();
    });
  });
  function boot(){
    if (!window.renderMathInElement){ setTimeout(boot, 60); return; }
    render();
  }
  boot();
});
</script></body></html>
