<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DADS 5250 · Generative AI in Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F4F7FC; --bg-grad-a: #EEF3FB; --bg-grad-b: #F5F0FF;
    --paper: #ffffff; --ink: #0f172a; --muted: #475569; --soft: #94a3b8;
    --border: #E1E8F2; --line: #CFDAEA;
    --blue: #0055D4; --blue-deep: #001A70; --blue-light: #4A7FE6; --blue-soft: #EEF3FB;
    --gold: #D4A017; --gold-soft: #FAF3E0;
    --olive: #5C7A4A; --olive-soft: #F0F4EA;
    --crimson: #C41230; --crimson-soft: #FDF2F3;
    --purple: #7C3AED; --purple-soft: #F5F0FF;
    --cyan: #0E9DBF; --cyan-soft: #E6F7FB;
    --ok: #10B981; --warn: #F59E0B; --danger: #EF4444;
  }
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(ellipse at top left, var(--bg-grad-a), transparent 50%),
      radial-gradient(ellipse at top right, var(--bg-grad-b), transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink); font-family: 'Outfit', -apple-system, system-ui, sans-serif;
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .app {
    display: grid; grid-template-columns: 260px 1fr; gap: 18px;
    max-width: 1500px; margin: 0 auto; padding: 16px 22px 24px;
    min-height: 100vh;
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
    .sidebar { position: relative !important; max-height: none !important; padding: 10px; }
    .tools-grid { grid-template-columns: 1fr !important; gap: 10px; }
    .module-content, .tool-shell { padding: 16px 14px !important; }
    .mod-header h2 { font-size: 24px !important; }
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--paper); border: 1px solid var(--border);
    border-top: 3px solid var(--blue); border-radius: 12px;
    padding: 14px 12px 10px;
    display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 16px; align-self: start;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .brand { padding: 0 8px 10px; border-bottom: 1px solid var(--border); }
  .brand .code {
    font-family: 'Lora', Georgia, serif; font-size: 18px; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.01em; color: var(--blue); font-style: italic;
  }
  .brand .sub {
    font-family: 'Lora', Georgia, serif; font-size: 13.5px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.01em; color: var(--ink); margin-top: 4px;
  }
  .brand .tag {
    font-family: 'Lora', serif; font-style: italic; font-size: 11px; color: var(--muted); margin-top: 3px;
  }
  .nav-list { display: flex; flex-direction: column; gap: 1px; }
  .mod-item {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 10px; border-radius: 7px;
    cursor: pointer; position: relative;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .mod-item:hover { background: var(--blue-soft); }
  .mod-item.active {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    box-shadow: 0 3px 10px rgba(0,85,212,0.22);
  }
  .mod-item .num {
    font-family: 'Lora', Georgia, serif; font-style: italic; font-weight: 700;
    font-size: 14px; color: var(--blue); min-width: 22px; text-align: center; line-height: 1;
  }
  .mod-item.active .num { color: white; }
  .mod-item .label {
    flex: 1; min-width: 0;
    font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mod-item.active .label { color: white; }
  .mod-item .count {
    background: var(--gold); color: white;
    font-size: 9px; font-weight: 700; letter-spacing: 0.02em;
    padding: 1px 6px; border-radius: 999px; min-width: 17px; text-align: center; flex-shrink: 0;
  }
  .mod-item.active .count { background: rgba(255,255,255,0.28); }
  .mod-item.special .num { color: var(--purple); }
  .mod-item.special .label { color: var(--purple); font-weight: 600; }
  .mod-item.special.active { background: linear-gradient(135deg, var(--purple), #9F60FF); }
  .mod-item.special.active .num, .mod-item.special.active .label { color: white; }
  .mod-item.special .opt-badge {
    background: var(--purple); color: white;
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 999px;
  }
  .mod-item.special.active .opt-badge { background: rgba(255,255,255,0.28); }
  .phase-divider {
    font-family: 'Lora', serif; font-style: italic; font-size: 10px; color: var(--soft);
    letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700;
    padding: 8px 10px 2px;
  }
  .sidebar-foot {
    margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--border);
    font-family: 'Outfit', sans-serif; font-size: 10px; color: var(--soft);
    text-align: center; letter-spacing: 0.04em;
  }

  /* ============ MAIN ============ */
  .main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .module-content, .tool-shell {
    padding: 26px 28px; background: var(--paper); border: 1px solid var(--border); border-radius: 14px;
    animation: fade-in 0.35s ease-out;
  }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mod-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .mod-header .left { min-width: 0; flex: 1; }
  .mod-header .kicker {
    font-size: 11px; color: var(--gold); letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
    margin-bottom: 6px;
  }
  .mod-header h2 {
    font-family: 'Lora', Georgia, serif; font-size: 32px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.1;
  }
  .mod-header h2 em { font-style: italic; color: var(--blue); font-weight: 400; }
  .mod-header .lede {
    font-family: 'Lora', serif; font-style: italic; font-size: 15px; line-height: 1.7;
    color: var(--muted); margin-top: 12px; max-width: 760px;
  }
  .mod-header .meta { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; padding-top: 4px; }
  .meta-chip {
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600;
    padding: 6px 12px; background: var(--blue-soft); color: var(--blue);
    border-radius: 999px; letter-spacing: 0.04em;
  }
  .meta-chip.gold { background: var(--gold-soft); color: var(--gold); }
  .meta-chip.purple { background: var(--purple-soft); color: var(--purple); }

  /* ============ TOOL CARDS ============ */
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tool-card {
    background: var(--paper); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none; color: inherit; display: flex; flex-direction: column;
    border-top: 3px solid var(--blue); position: relative;
  }
  .tool-card:hover { transform: translateY(-3px); border-color: var(--blue); box-shadow: 0 14px 36px rgba(0,85,212,0.14); }
  .tool-card.gold { border-top-color: var(--gold); }
  .tool-card.olive { border-top-color: var(--olive); }
  .tool-card.crimson { border-top-color: var(--crimson); }
  .tool-card.purple { border-top-color: var(--purple); }
  .tool-card.cyan { border-top-color: var(--cyan); }
  .tool-card::before {
    content: ""; position: absolute; top: 0; right: 0; width: 80px; height: 80px;
    background: linear-gradient(135deg, transparent 50%, rgba(0,85,212,0.06) 100%);
    border-radius: 0 14px 0 80px; pointer-events: none;
  }
  .tool-card.gold::before { background: linear-gradient(135deg, transparent 50%, rgba(212,160,23,0.08) 100%); }
  .tool-card.olive::before { background: linear-gradient(135deg, transparent 50%, rgba(92,122,74,0.08) 100%); }
  .tool-card.crimson::before { background: linear-gradient(135deg, transparent 50%, rgba(196,18,48,0.08) 100%); }
  .tool-card.purple::before { background: linear-gradient(135deg, transparent 50%, rgba(124,58,237,0.08) 100%); }
  .tool-card.cyan::before { background: linear-gradient(135deg, transparent 50%, rgba(14,157,191,0.08) 100%); }
  .tool-icon { padding: 16px 18px 6px; color: var(--blue); display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .tool-icon svg { width: 30px; height: 30px; flex-shrink: 0; }
  .tool-card.gold .tool-icon { color: var(--gold); }
  .tool-card.olive .tool-icon { color: var(--olive); }
  .tool-card.crimson .tool-icon { color: var(--crimson); }
  .tool-card.purple .tool-icon { color: var(--purple); }
  .tool-card.cyan .tool-icon { color: var(--cyan); }
  .tool-type-row { display: flex; justify-content: space-between; align-items: center; flex: 1; }
  .tool-type {
    font-family: 'Outfit', sans-serif; font-size: 10px; color: var(--blue);
    letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
  }
  .tool-card.gold .tool-type { color: var(--gold); }
  .tool-card.olive .tool-type { color: var(--olive); }
  .tool-card.crimson .tool-type { color: var(--crimson); }
  .tool-card.purple .tool-type { color: var(--purple); }
  .tool-card.cyan .tool-type { color: var(--cyan); }
  .tool-time { font-size: 10.5px; color: var(--soft); font-weight: 500; }
  .tool-title {
    font-family: 'Lora', Georgia, serif; font-size: 18px; font-weight: 700; line-height: 1.15;
    padding: 4px 18px 8px; color: var(--ink); position: relative; z-index: 1;
  }
  .tool-title em { font-style: italic; color: var(--blue); font-weight: 400; }
  .tool-card.gold .tool-title em { color: var(--gold); }
  .tool-card.olive .tool-title em { color: var(--olive); }
  .tool-card.crimson .tool-title em { color: var(--crimson); }
  .tool-card.purple .tool-title em { color: var(--purple); }
  .tool-card.cyan .tool-title em { color: var(--cyan); }
  .tool-desc { font-family: 'Lora', serif; font-size: 13px; line-height: 1.55; color: var(--muted); padding: 0 18px 14px; flex: 1; position: relative; z-index: 1; }
  .tool-open {
    padding: 12px 18px; background: var(--bg); border-top: 1px solid var(--border);
    font-family: 'Outfit', sans-serif; font-size: 11.5px; color: var(--blue); font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tool-open svg { width: 14px; height: 14px; transition: transform 0.2s; }
  .tool-card:hover .tool-open svg { transform: translateX(3px); }
  .tool-card.gold .tool-open { color: var(--gold); }
  .tool-card.olive .tool-open { color: var(--olive); }
  .tool-card.crimson .tool-open { color: var(--crimson); }
  .tool-card.purple .tool-open { color: var(--purple); }
  .tool-card.cyan .tool-open { color: var(--cyan); }
  .placeholder {
    text-align: center; padding: 50px 24px;
    font-family: 'Lora', serif; font-style: italic; color: var(--muted);
    background: var(--bg); border-radius: 12px; border: 1px dashed var(--line);
  }
  .placeholder svg { width: 40px; height: 40px; margin-bottom: 12px; color: var(--soft); }
  .placeholder strong { font-style: normal; color: var(--blue); font-weight: 700; }
  .special-banner { padding: 14px 18px; border-radius: 10px; font-family: 'Lora', serif; font-style: italic; font-size: 14px; margin-bottom: 18px; line-height: 1.6; }
  .special-banner.hackathon { background: var(--gold-soft); border-left: 4px solid var(--gold); color: #6b4f0a; }
  .special-banner.final { background: var(--purple-soft); border-left: 4px solid var(--purple); color: #4c1d95; }
  .special-banner strong { font-style: normal; font-weight: 700; }

  /* ============ TOOL VIEW ============ */
  .crumbs { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 12px; }
  .crumbs a { color: var(--blue); text-decoration: none; cursor: pointer; font-weight: 600; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--soft); }
  .crumbs .here { color: var(--ink); font-weight: 600; }
  .tool-shell h2 {
    font-family: 'Lora', Georgia, serif; font-size: 28px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 6px;
  }
  .tool-shell h2 em { font-style: italic; color: var(--blue); font-weight: 400; }
  .tool-shell .tool-lede {
    font-family: 'Lora', serif; font-style: italic; font-size: 14px;
    color: var(--muted); margin-bottom: 22px; max-width: 720px;
  }

  /* ====== Tool: Temperature Explorer ====== */
  .temp-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px) { .temp-wrap { grid-template-columns: 1fr; } }
  .temp-card { background: linear-gradient(180deg, #fff, #FAFCFF); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .temp-card .h { font-weight: 600; font-size: 13px; color: var(--blue-deep); margin-bottom: 10px; letter-spacing: .03em; text-transform: uppercase; font-family: 'Outfit'; }
  .temp-prompt {
    background: var(--blue-soft); border: 1px solid #C8DAF7; padding: 18px;
    border-radius: 10px; font-family: 'Lora'; font-size: 17px; text-align: center; margin-bottom: 18px; color: var(--blue-deep); font-weight: 600;
  }
  .temp-prompt .sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; font-weight: 500; }
  .slider-wrap { padding: 8px 4px; }
  .slider-val { font-size: 18px; font-weight: 700; color: var(--blue); text-align: center; margin-bottom: 6px; font-family: 'Outfit'; }
  .slider-val .lbl { font-size: 10px; color: var(--muted); letter-spacing: .15em; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 2px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: linear-gradient(90deg, var(--blue) 0%, var(--cyan) 50%, var(--crimson) 100%); border-radius: 999px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: white; border: 3px solid var(--blue); border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .slider-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--soft); margin-top: 6px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .prob-list { display: flex; flex-direction: column; gap: 8px; }
  .prob-row { display: grid; grid-template-columns: 80px 1fr 50px; align-items: center; gap: 10px; }
  .prob-word { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); font-weight: 500; }
  .prob-bar { height: 12px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .prob-bar .fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); border-radius: 999px; transition: width 0.3s; }
  .prob-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-align: right; font-weight: 600; }
  .temp-insight { margin-top: 18px; padding: 14px 16px; background: var(--gold-soft); border-left: 3px solid var(--gold); border-radius: 8px; font-family: 'Lora', serif; font-size: 13px; color: #6b4f0a; line-height: 1.55; }
  .temp-insight strong { font-weight: 700; color: var(--gold); }

  /* ====== Tool: Prompt Anatomy Builder ====== */
  .prompt-grid { display: grid; grid-template-columns: 280px 1fr; gap: 18px; }
  @media (max-width: 720px) { .prompt-grid { grid-template-columns: 1fr; } }
  .pa-blocks { display: flex; flex-direction: column; gap: 10px; }
  .pa-block {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: white; border: 1.5px solid var(--border); border-radius: 10px;
    cursor: pointer; transition: all 0.18s; font-size: 13px;
  }
  .pa-block:hover { border-color: var(--blue); background: var(--blue-soft); }
  .pa-block.added { opacity: 0.4; border-style: dashed; }
  .pa-block .ico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; color: white; font-weight: 700; font-size: 14px; font-family: 'Lora', serif; font-style: italic; }
  .pa-block.role .ico { background: linear-gradient(135deg, var(--blue), var(--blue-light)); }
  .pa-block.task .ico { background: linear-gradient(135deg, var(--crimson), #E94560); }
  .pa-block.context .ico { background: linear-gradient(135deg, var(--olive), #7DA15C); }
  .pa-block.format .ico { background: linear-gradient(135deg, var(--gold), #E8B838); }
  .pa-block.examples .ico { background: linear-gradient(135deg, var(--purple), #9F60FF); }
  .pa-block .info { flex: 1; min-width: 0; }
  .pa-block .info .t { font-weight: 600; color: var(--ink); }
  .pa-block .info .s { font-size: 11px; color: var(--muted); font-family: 'Lora', serif; font-style: italic; }
  .pa-preview { background: linear-gradient(180deg, #fff, #FAFCFF); border: 1px solid var(--border); border-radius: 12px; padding: 18px; min-height: 200px; }
  .pa-prompt-out { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; min-height: 140px; padding: 14px; background: var(--bg); border-radius: 8px; border: 1px dashed var(--line); }
  .pa-empty { color: var(--soft); font-style: italic; font-family: 'Lora', serif; text-align: center; padding: 30px; font-size: 13px; }
  .pa-score { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .pa-score .label { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
  .pa-score .bar { flex: 1; height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .pa-score .bar .f { height: 100%; background: linear-gradient(90deg, var(--crimson), var(--gold), var(--ok)); border-radius: 999px; transition: width .3s; }
  .pa-score .val { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--blue); font-size: 14px; min-width: 60px; text-align: right; }
  .pa-reset { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: 'Outfit'; transition: all .15s; }
  .pa-reset:hover { background: var(--crimson-soft); color: var(--crimson); border-color: var(--crimson); }

  /* ====== Tool: Prompt Injection Lab ====== */
  .inj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
  @media (max-width: 720px) { .inj-grid { grid-template-columns: 1fr; } }
  .bot-card { background: white; border: 2px solid var(--border); border-radius: 12px; padding: 18px; text-align: center; position: relative; overflow: hidden; transition: all .3s; }
  .bot-card.vuln { border-top: 4px solid var(--crimson); }
  .bot-card.hard { border-top: 4px solid var(--ok); }
  .bot-card .bot-icon { width: 50px; height: 50px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; }
  .bot-card.vuln .bot-icon { background: var(--crimson-soft); color: var(--crimson); }
  .bot-card.hard .bot-icon { background: rgba(16,185,129,.12); color: var(--ok); }
  .bot-card .bot-icon svg { width: 30px; height: 30px; }
  .bot-card h3 { font-family: 'Lora', serif; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .bot-card.vuln h3 { color: var(--crimson); }
  .bot-card.hard h3 { color: var(--ok); }
  .bot-card p { font-size: 12px; color: var(--muted); font-style: italic; font-family: 'Lora', serif; margin-bottom: 12px; }
  .bot-score { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; }
  .bot-card.vuln .bot-score { color: var(--crimson); }
  .bot-card.hard .bot-score { color: var(--ok); }
  .bot-score-lbl { font-size: 10px; color: var(--soft); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
  .fire-btn { margin-top: 12px; padding: 8px 18px; border: none; border-radius: 8px; font-family: 'Outfit'; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
  .fire-btn.v { background: linear-gradient(135deg, var(--crimson), #E94560); color: white; }
  .fire-btn.h { background: linear-gradient(135deg, var(--ok), #34D399); color: white; }
  .fire-btn:disabled { opacity: .35; cursor: not-allowed; }
  .fire-btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  .bot-card.breached { animation: shake .5s; }
  .bot-card.defended { animation: pulse-ok .5s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes pulse-ok { 0%,100%{box-shadow: 0 0 0 0 rgba(16,185,129,0)} 50%{box-shadow: 0 0 0 8px rgba(16,185,129,.3)} }
  .deck-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .deck-title h4 { font-family: 'Lora', serif; font-size: 18px; color: var(--blue-deep); font-weight: 700; }
  .deck-title small { color: var(--soft); font-size: 11px; font-style: italic; }
  .attack-deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .attack-card { background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: all .18s; position: relative; }
  .attack-card:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.06); }
  .attack-card.selected { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 3px rgba(0,85,212,.15); }
  .attack-card .tier { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: .08em; }
  .attack-card .tier.easy { background: rgba(212,160,23,.15); color: var(--gold); }
  .attack-card .tier.med { background: rgba(245,158,11,.2); color: #B45309; }
  .attack-card .tier.hard { background: rgba(124,58,237,.18); color: var(--purple); }
  .attack-card .a-name { font-family: 'Lora', serif; font-weight: 700; font-size: 13.5px; color: var(--blue-deep); margin: 6px 0 2px; }
  .attack-card .a-desc { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .hall { margin-top: 18px; padding: 14px 16px; background: linear-gradient(135deg, var(--gold-soft), #FFF9E8); border: 1px solid var(--gold); border-radius: 10px; }
  .hall h5 { font-family: 'Lora', serif; font-style: italic; color: var(--gold); font-size: 13px; margin-bottom: 6px; }
  .hall-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .hall-pill { background: white; border: 1px solid var(--gold); padding: 3px 8px; border-radius: 999px; font-size: 11px; color: #6b4f0a; font-weight: 600; }

  /* ====== Tool: Tokenizer ====== */
  .tok-card { background: linear-gradient(180deg, #fff, #FAFCFF); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .tok-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; resize: vertical; min-height: 70px; outline: none; transition: border-color .15s; }
  .tok-input:focus { border-color: var(--blue); }
  .tok-radio { display: flex; gap: 14px; margin: 12px 0; flex-wrap: wrap; }
  .tok-radio label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; cursor: pointer; }
  .tok-radio input { accent-color: var(--blue); }
  .tok-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
  .tok-stat { background: var(--blue-soft); border-radius: 10px; padding: 12px 14px; text-align: center; }
  .tok-stat .n { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--blue); }
  .tok-stat .l { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-top: 2px; }
  .tok-out { display: flex; flex-wrap: wrap; gap: 4px; padding: 14px; background: var(--bg); border-radius: 10px; min-height: 60px; }
  .tok-piece { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 3px 7px; border-radius: 5px; color: var(--ink); }
  .tok-piece.c0 { background: rgba(0,85,212,.12); color: var(--blue); }
  .tok-piece.c1 { background: rgba(212,160,23,.18); color: var(--gold); }
  .tok-piece.c2 { background: rgba(92,122,74,.18); color: var(--olive); }
  .tok-piece.c3 { background: rgba(124,58,237,.18); color: var(--purple); }
  .tok-piece.c4 { background: rgba(14,157,191,.18); color: var(--cyan); }

  /* ====== Tool: Embeddings ====== */
  .emb-canvas { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 18px; position: relative; }
  .emb-scatter { width: 100%; height: 380px; position: relative; background: linear-gradient(135deg, #FAFCFF, #F4F7FC); border-radius: 10px; }
  .emb-dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: all .2s; transform: translate(-50%, -50%); border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .emb-dot:hover { transform: translate(-50%, -50%) scale(1.4); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .emb-dot.near { box-shadow: 0 0 0 4px rgba(0,85,212,.25); width: 16px; height: 16px; }
  .emb-legend { position: absolute; top: 24px; right: 24px; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11px; }
  .emb-legend .item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .emb-legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .emb-detail { background: var(--bg); border-radius: 10px; padding: 14px; margin-top: 14px; min-height: 60px; }
  .emb-detail .h { font-size: 11px; color: var(--soft); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
  .emb-detail .s { font-family: 'Lora', serif; font-style: italic; color: var(--ink); font-size: 14px; }

  /* ====== Tool: ReAct Player ====== */
  .react-controls { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--blue-soft); border-radius: 10px; margin-bottom: 14px; }
  .react-btn { width: 38px; height: 38px; border: none; border-radius: 50%; background: white; color: var(--blue); cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.08); transition: all .15s; }
  .react-btn.play { background: linear-gradient(135deg, var(--ok), #34D399); color: white; width: 42px; height: 42px; }
  .react-btn:hover { transform: translateY(-1px); }
  .react-btn svg { width: 18px; height: 18px; }
  .react-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
  .react-progress .step-n { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); font-weight: 600; }
  .react-progress input[type=range] { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
  .react-step { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; animation: fade-in .25s; }
  .react-step .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .react-step.thought { background: var(--purple-soft); border-color: var(--purple); }
  .react-step.thought .lbl { color: var(--purple); }
  .react-step.action { background: var(--blue-soft); border-color: var(--blue); }
  .react-step.action .lbl { color: var(--blue); }
  .react-step.observation { background: var(--olive-soft); border-color: var(--olive); }
  .react-step.observation .lbl { color: var(--olive); }
  .react-step.final { background: var(--gold-soft); border-color: var(--gold); }
  .react-step.final .lbl { color: var(--gold); }
  .react-step .txt { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink); line-height: 1.55; }

  /* ====== Tool: Generic stub ====== */
  .stub-hero { padding: 60px 30px; text-align: center; background: linear-gradient(135deg, var(--blue-soft), var(--purple-soft)); border-radius: 14px; border: 1px dashed var(--blue); }
  .stub-hero svg { width: 48px; height: 48px; margin-bottom: 14px; color: var(--blue); }
  .stub-hero h3 { font-family: 'Lora', serif; font-size: 22px; color: var(--blue-deep); margin-bottom: 6px; }
  .stub-hero p { color: var(--muted); font-family: 'Lora', serif; font-style: italic; max-width: 460px; margin: 0 auto; }
</style>

<script>
const $ = id => document.getElementById(id);

const ICON = {
  thermometer: '<svg><use href="#i-thermometer"/></svg>',
  tokens: '<svg><use href="#i-tokens"/></svg>',
  puzzle: '<svg><use href="#i-puzzle"/></svg>',
  chain: '<svg><use href="#i-chain"/></svg>',
  shield: '<svg><use href="#i-shield"/></svg>',
  robot: '<svg><use href="#i-robot"/></svg>',
  eye: '<svg><use href="#i-eye"/></svg>',
  grid: '<svg><use href="#i-grid"/></svg>',
  flow: '<svg><use href="#i-flow"/></svg>',
  rocket: '<svg><use href="#i-rocket"/></svg>',
  sparkle: '<svg><use href="#i-sparkle"/></svg>'
};

const MODULES = [
  { n: 1, phase: 'found', short: 'LLM APIs', name: 'Getting Started with LLM APIs',
    lede: 'Open the box. See how a language model actually responds to your call. Slide the temperature, count the tokens, and watch probability turn into text.',
    meta: ['Phase 1', '~3 hrs'],
    tools: [
      { id: 'temperature', type: 'Sandbox', icon: 'thermometer', title: 'Temperature <em>Explorer</em>', desc: 'Interactive slider showing how temperature shapes the probability of the next word.', time: '~10 min', color: 'crimson' },
      { id: 'tokenizer', type: 'Sandbox', icon: 'tokens', title: 'Tokenizer <em>Explorer</em>', desc: 'Word, character, and subword tokenization side by side. The same sentence costs different numbers of tokens.', time: '~8 min', color: 'cyan' }
    ]},
  { n: 2, phase: 'found', short: 'Prompting', name: 'Prompt Engineering',
    lede: 'A great prompt has parts. Role, task, context, format, examples. Drop them in, watch the quality climb.',
    meta: ['Phase 1', '~3 hrs'],
    tools: [
      { id: 'prompt-anatomy', type: 'Builder', icon: 'puzzle', title: 'Prompt Anatomy <em>Builder</em>', desc: 'Drag role / task / context / format / examples blocks. Compare bare task vs structured prompt side by side.', time: '~15 min', color: 'blue' }
    ]},
  { n: 3, phase: 'found', short: 'Structured Output', name: 'Structured Output and Function Calling', lede: 'Turn free text into a typed object. JSON, schemas, and tool calls.', meta: ['Phase 1', '~3 hrs'], tools: [] },
  { n: 4, phase: 'found', short: 'LangChain', name: 'LangChain and the Beer Game',
    lede: 'A LangChain "chain" is just a pipeline. Add nodes, hit run, watch data flow stage to stage.',
    meta: ['Phase 1', '~3 hrs'],
    tools: [
      { id: 'chain-viz', type: 'Visualizer', icon: 'chain', title: 'Chain <em>Visualizer</em>', desc: 'Add PromptTemplate / ChatModel / OutputParser nodes. Run the chain. Watch input and output at every stage.', time: '~12 min', color: 'olive' }
    ]},
  { n: 5, phase: 'core', short: 'RAG', name: 'Retrieval-Augmented Generation',
    lede: 'Chunk the document, embed the chunks, retrieve the relevant ones, ground the answer. The full RAG pipeline, made visible.',
    meta: ['Phase 2', '~3 hrs'],
    tools: [
      { id: 'chunking', type: 'Sandbox', icon: 'grid', title: 'Text <em>Chunking</em>', desc: 'Basic vs recursive chunking. Adjustable chunk size and overlap. Visual boundaries on a sample document.', time: '~10 min', color: 'gold' },
      { id: 'embeddings', type: 'Explorer', icon: 'sparkle', title: 'Embedding <em>Space Explorer</em>', desc: 'Real OpenAI embeddings reduced to 2D. Click any dot to highlight its 3 nearest neighbors.', time: '~12 min', color: 'purple' }
    ]},
  { n: 6, phase: 'core', short: 'Agents', name: 'Agents and LangGraph',
    lede: 'A tool-using agent is just a loop. Thought, Action, Observation, Thought, until it has the answer.',
    meta: ['Phase 2', '~3 hrs'],
    tools: [
      { id: 'react-player', type: 'Player', icon: 'robot', title: 'ReAct Trace <em>Player</em>', desc: 'A canned ReAct trace with playback controls. Step through Thought → Action → Observation.', time: '~10 min', color: 'cyan' }
    ]},
  { n: 7, phase: 'core', short: 'Hackathon', name: 'Hackathon', special: 'hackathon',
    lede: 'No lab. No notebook. Build something real with everything you have learned so far. 48 hours, your stack, your team, your demo.',
    meta: ['Phase 2', 'Hackathon · 48 hrs'], tools: [] },
  { n: 8, phase: 'adv', short: 'Multi-Agent', name: 'Multi-Agent Systems with CrewAI', lede: 'Multiple agents, multiple roles, coordinated work. The CrewAI way.', meta: ['Phase 3', '~3 hrs'], tools: [] },
  { n: 9, phase: 'adv', short: 'Vision & Eval', name: 'Vision and Evaluation', lede: 'Vision-language models, image inputs, and how you grade what these systems produce.', meta: ['Phase 3', '~3 hrs'], tools: [] },
  { n: 10, phase: 'adv', short: 'GenAI Platforms', name: 'GenAI Platforms', lede: 'Survey the platform landscape. Hugging Face, OpenRouter, Bedrock. What each is for.', meta: ['Phase 3', '~3 hrs'], tools: [] },
  { n: 11, phase: 'adv', short: 'MCP & Guardrails', name: 'MCP, Guardrails and Safety',
    lede: 'Model Context Protocol. Guardrails. And the gamified Prompt Injection Lab where you attack one bot and defend another.',
    meta: ['Phase 3', '~3 hrs'],
    tools: [
      { id: 'injection', type: 'Game', icon: 'shield', title: 'Prompt <em>Injection Lab</em>', desc: 'Ten attack cards across three tiers. Drag-to-fire at vulnerable and hardened bots. Live scoreboard. Hall of Fame.', time: '~20 min', color: 'crimson' }
    ]},
  { n: 12, phase: 'prod', short: 'n8n Automation', name: 'Workflow Automation with n8n', lede: 'Move your prototype out of the notebook. Trigger flows, connect tools, ship a workflow.', meta: ['Phase 4', '~3 hrs'], tools: [] },
  { n: 13, phase: 'prod', short: 'Fine-Tuning', name: 'Fine-Tuning and Deployment', lede: 'When to fine-tune, when not to. How to ship the result.', meta: ['Phase 4', '~3 hrs'], tools: [] },
  { n: 14, phase: 'prod', short: 'Final Project', name: 'Final Project', special: 'final', lede: 'Build something useful. Demonstrate it live. The same 4D arc applied to a real problem you care about.', meta: ['Phase 4', 'Capstone'], tools: [] }
];

let view = { kind: 'module', n: 1, toolId: null };

function findTool(id) {
  for (const m of MODULES) for (const t of (m.tools||[])) if (t.id === id) return { tool: t, module: m };
  return null;
}

/* ============ SIDEBAR ============ */
function buildSidebar() {
  document.querySelectorAll('.nav-list').forEach(nav => nav.innerHTML = '');
  MODULES.forEach(m => {
    const nav = document.querySelector(`.nav-list[data-phase="${m.phase}"]`);
    const isSpecial = !!m.special;
    const item = document.createElement('div');
    const isActive = view.kind === 'module' ? (m.n === view.n) : (view.toolId && findTool(view.toolId).module.n === m.n);
    item.className = 'mod-item' + (isActive ? ' active' : '') + (isSpecial ? ' special' : '');
    const right = isSpecial
      ? `<div class="opt-badge">${m.special === 'hackathon' ? 'HACK' : 'FINAL'}</div>`
      : `<div class="count">${m.tools.length}</div>`;
    item.innerHTML = `<div class="num">${m.n}</div><div class="label">${m.short}</div>${right}`;
    item.addEventListener('click', () => { view = { kind: 'module', n: m.n, toolId: null }; render(); });
    nav.appendChild(item);
  });
}

/* ============ MODULE VIEW ============ */
function renderModule() {
  const m = MODULES.find(x => x.n === view.n);
  const parts = m.name.split(/\s+/);
  const last = parts.pop();
  const head = parts.join(' ') + ' <em>' + last + '</em>';
  const banner = m.special === 'hackathon'
    ? `<div class="special-banner hackathon"><strong>Hackathon week.</strong> No lab, no quiz. Show up with a team and a problem, leave with a working demo.</div>`
    : m.special === 'final'
      ? `<div class="special-banner final"><strong>Final project.</strong> Pick a problem that matters to you. Build it with the stack you choose.</div>`
      : '';
  $('main').innerHTML = `
    <div class="module-content">

function renderTemperature() {
  $('tool-body').innerHTML = `
    <div class="temp-wrap">
      <div class="temp-card">
        <div class="h">Sample Sentence</div>
        <div class="temp-prompt">"The kid is chasing the…"<div class="sub">How will the model complete this?</div></div>
        <div class="slider-wrap">
          <div class="slider-val"><span class="lbl">Temperature</span><span id="temp-val">0.7</span></div>
          <input type="range" id="temp-slider" min="0.1" max="2.0" step="0.05" value="0.7">
          <div class="slider-row"><span>More predictable</span><span>1.1</span><span>More random</span></div>
        </div>
        <div class="temp-insight">
          <strong>What's happening?</strong> Lower temperature sharpens the probability distribution: the model commits to its top guess. Higher temperature flattens it: every alternative becomes more viable.
        </div>
      </div>
      <div class="temp-card">
        <div class="h">Next-Word Probabilities</div>
        <div class="prob-list" id="prob-list"></div>
      </div>
    </div>`;
  const words = [{w:'cat', logit:3.0},{w:'ball', logit:2.3},{w:'dog', logit:1.8},{w:'butterfly', logit:0.9},{w:'cloud', logit:0.3},{w:'rainbow', logit:-0.3}];
  function recompute(T) {
    const exps = words.map(x => Math.exp(x.logit / Math.max(0.05, T)));
    const sum = exps.reduce((a,b)=>a+b,0);
    return words.map((x,i) => ({...x, p: exps[i]/sum}));
  }
  function paint() {
    const T = parseFloat($('temp-slider').value);
    $('temp-val').textContent = T.toFixed(2);
    const probs = recompute(T).sort((a,b)=>b.p-a.p);
    $('prob-list').innerHTML = probs.map(p => `
      <div class="prob-row">
        <div class="prob-word">${p.w}</div>
        <div class="prob-bar"><div class="fill" style="width:${(p.p*100).toFixed(1)}%"></div></div>
        <div class="prob-pct">${(p.p*100).toFixed(1)}%</div>
      </div>`).join('');
  }
  $('temp-slider').addEventListener('input', paint);
  paint();
}

function renderTokenizer() {
  $('tool-body').innerHTML = `
    <div class="tok-card">
      <div class="h" style="font-weight:600;font-size:13px;color:var(--blue-deep);margin-bottom:10px;letter-spacing:.03em;text-transform:uppercase;">Enter text</div>
      <textarea id="tok-input" class="tok-input">Hello world! Tokenization is wild. Pre-training matters.</textarea>
      <div class="tok-radio">
        <label><input type="radio" name="tmode" value="word" checked> Word-level</label>
        <label><input type="radio" name="tmode" value="char"> Character-level</label>
        <label><input type="radio" name="tmode" value="sub"> Subword (BPE-ish)</label>
      </div>
      <div class="tok-out" id="tok-out"></div>
      <div class="tok-stats" id="tok-stats"></div>
    </div>`;
  function tok() {
    const text = $('tok-input').value;
    const mode = document.querySelector('input[name=tmode]:checked').value;
    let pieces = [];
    if (mode === 'word') pieces = text.match(/\S+|\s+/g) || [];
    else if (mode === 'char') pieces = [...text];
    else pieces = text.match(/[A-Za-z]{1,4}|[^A-Za-z\s]|\s+/g) || [];
    $('tok-out').innerHTML = pieces.map((p,i)=>{
      const cls = 'c'+(i%5);
      return `<span class="tok-piece ${cls}">${p === ' ' ? '·' : p.replace(/\s/g, '·')}</span>`;
    }).join('');
    const tokens = pieces.filter(p => !/^\s+$/.test(p));
    const chars = text.length;
    const ratio = (chars / Math.max(1, tokens.length)).toFixed(1);
    $('tok-stats').innerHTML = `
      <div class="tok-stat"><div class="n">${tokens.length}</div><div class="l">Tokens</div></div>
      <div class="tok-stat"><div class="n">${chars}</div><div class="l">Characters</div></div>
      <div class="tok-stat"><div class="n">${ratio}</div><div class="l">Chars / Token</div></div>`;
  }
  $('tok-input').addEventListener('input', tok);
  document.querySelectorAll('input[name=tmode]').forEach(r => r.addEventListener('change', tok));
  tok();
}

    {t:'weather', c:'#7C3AED', s:'Tropical thunderstorms peak in late afternoon.'}
  ];
  const seed = 17;
  function rnd(i) { return ((Math.sin(i*seed) + 1) * 0.5); }
  const dots = SENT.map((s, i) => {
    const cluster = {tech:[20,28], food:[72,30], sports:[30,72], weather:[78,72]}[s.t];

      render();

  if (params.module) {
    const n = parseInt(params.module, 10);
    if (n >= 1 && n <= MODULES.length) { view = { kind: 'module', n, toolId: null }; render(); return; }
  }
  render();
}
function autoFillCurrent() {
  if (view.kind !== 'tool') return;
  const id = view.toolId;
  if (id === 'prompt-anatomy') {
    ['role','task','context','format','examples'].forEach(blockId => {
      const b = document.querySelector('.pa-block[data-id="'+blockId+'"]');
      if (b) b.click();
    });
  } else if (id === 'react-player') {
    if (window.RX && typeof window.rx_step !== 'undefined') {
      window.rx_step = window.RX.length;
      const range = document.getElementById('rx-range');
      if (range) { range.value = window.RX.length; range.dispatchEvent(new Event('input')); }
    }
  } else if (id === 'injection') {
    const fv = document.getElementById('fire-v');
    if (fv) { fv.click(); fv.click(); fv.click(); }
    const fh = document.getElementById('fire-h');
    if (fh) { fh.click(); }
  } else if (id === 'temperature') {
    const slider = document.querySelector('input[type="range"]');
    if (slider) { slider.value = 1.2; slider.dispatchEvent(new Event('input')); }
  }
}
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
