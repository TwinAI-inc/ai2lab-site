<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Italian Corridor — DOC Italy 2027 · Private Preview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --neu-red: #C41230;
    --it-green: #009246;
    --it-red: #ce2b37;
    --navy: #1a1a2e;
    --gold: #d4a84b;
    --text: #1a1a2e;
    --muted: #64748b;
    --bg: #fafbfc;
    --card: #ffffff;
    --border: #e8eaee;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: linear-gradient(135deg, #fafbfc 0%, #f3f4f7 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(0,146,70,0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(206,43,55,0.08) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(212,168,75,0.05) 0%, transparent 60%);
    z-index: 0;
  }
  .gate {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 24px;
    padding: 48px 40px 40px;
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.04);
    border: 1px solid var(--border);
    text-align: center;
  }
  .flag-strip {
    display: flex;
    height: 6px;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 auto 28px;
    width: 80px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .flag-strip > div { flex: 1; }
  .flag-strip > div:nth-child(1) { background: var(--it-green); }
  .flag-strip > div:nth-child(2) { background: #ffffff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .flag-strip > div:nth-child(3) { background: var(--it-red); }
  .program {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: var(--it-green);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 8px;
    color: var(--navy);
  }
  h1 .accent { color: var(--it-red); font-style: italic; }
  .sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 32px;
  }
  .lock-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--it-green) 0%, #007a3b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 146, 70, 0.25);
  }
  .lock-icon svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  form { display: flex; flex-direction: column; gap: 14px; }
  .input-wrap { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 16px 18px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    color: var(--text);
    background: #fafbfc;
    outline: none;
    transition: all 0.2s ease;
    letter-spacing: 4px;
    text-align: center;
    font-weight: 600;
  }
  input#nm {
    letter-spacing: 0;
    text-align: left;
    font-weight: 500;
  }
  .field-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: left;
    margin: 0 0 -6px 4px;
    letter-spacing: 0.3px;
  }
  input:focus {
    border-color: var(--it-green);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(0, 146, 70, 0.08);
  }
  input.error {
    border-color: var(--it-red);
    background: #fff5f5;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  button {
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--navy) 0%, #2a2a48 100%);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 16px rgba(26, 26, 46, 0.2);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(26, 26, 46, 0.28); }
  button:active { transform: translateY(0); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.6;
  }
  .hint a { color: var(--neu-red); text-decoration: none; font-weight: 500; }
  .hint a:hover { text-decoration: underline; }
  .err-msg {
    font-size: 13px;
    color: var(--it-red);
    margin-top: 4px;
    min-height: 18px;
    font-weight: 500;
  }
  .footer-mark {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .footer-mark .neu { color: var(--neu-red); font-weight: 600; }
</style>
</head>
<body>
  <div class="gate">
    <div class="flag-strip"><div></div><div></div><div></div></div>
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="program">Dialogue of Civilizations · Summer 1 2027</div>
    <h1>The Italian <span class="accent">Corridor</span></h1>
    <div class="sub">Technology, Innovation &amp; Culture</div>
    <div class="meta">PRIVATE PREVIEW · ACCESS BY INVITATION</div>

    <form id="gate-form" autocomplete="off">
      <div class="field-label">Your name</div>
      <div class="input-wrap">
        <input
          type="text"
          id="nm"
          placeholder="e.g. Maria Rossi"
          maxlength="40"
          autocomplete="name"
          aria-label="Your name"
          required>
      </div>
      <div class="field-label">Access code</div>
      <div class="input-wrap">
        <input
          type="password"
          id="pw"
          placeholder="••••"
          maxlength="32"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
          aria-label="Access code">
      </div>
      <div class="err-msg" id="err"></div>
      <button type="submit">Enter Itinerary</button>
    </form>

    <div class="hint">
      Need access? Contact <a href="mailto:mo.dehghani@northeastern.edu">Prof. Dehghani</a><br>
      Faculty Lead · NEU College of Engineering
    </div>
    <div class="footer-mark">
      <span class="neu">NORTHEASTERN</span> · UNIVERSITY OF PARMA · DOC 2027
    </div>
  </div>

<script>
  // SHA-256("2026") — gate hash. Note: this is a soft gate, not real security.
  const GATE_HASH = '158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab';
  const FLAG_KEY = 'docItalyAccess2027';
  const FLAG_VAL = 'unlocked';

  async function sha256(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  if (sessionStorage.getItem(FLAG_KEY) === FLAG_VAL) {
    location.replace('program.html');
  }

  const form = document.getElementById('gate-form');
  const input = document.getElementById('pw');
  const nameInput = document.getElementById('nm');
  const err = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    input.classList.remove('error');
    nameInput.classList.remove('error');

    const name = nameInput.value.trim();
    if (!name) {
      nameInput.classList.add('error');
      err.textContent = 'Please enter your name.';
      nameInput.focus();
      return;
    }
    const v = input.value.trim();
    if (!v) return;
    const h = await sha256(v);
    if (h === GATE_HASH) {
      try { localStorage.setItem('docItalyName', name); } catch (_) {}
      sessionStorage.setItem(FLAG_KEY, FLAG_VAL);
      location.replace('program.html');
    } else {
      input.classList.add('error');
      err.textContent = 'Incorrect access code.';
      input.value = '';
      input.focus();
    }
  });

  try {
    const saved = localStorage.getItem('docItalyName');
    if (saved) { nameInput.value = saved; input.focus(); }
    else { nameInput.focus(); }
  } catch (_) { nameInput.focus(); }
</script>
</body>
</html>
